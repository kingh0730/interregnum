<!doctype html>
<html><head><meta charset="utf-8"><title>j15_standby</title></head>
<body>
<script src="kit_s01_s20.js"></script>
<script>
// J15 stand-by (shared, opaque): radial gradient #123A5E → #07111F with the Lamp centered, breathing ±3 % at
// 0.25 Hz (a 4 s period, so any 4 s multiple loops seamlessly), no text. Used on the TVs / billboard / wall in
// shots 15, 16 and 43. ?static=1 turns breathing off (shot 43; comp applies the 50 % brightness there).
// Breathing phase: sin(2π·0.25·t), t = 0 at the start of the render.
const STATIC = new URLSearchParams(location.search).get('static') === '1' || location.hash === '#static';
const ctx = K.canvas(true);
const em = K.off(1920, 1080), ec = em.getContext('2d');
window.renderFrame = (t) => {
  const b = STATIC ? 0 : Math.sin(2 * Math.PI * 0.25 * t);
  const g = ctx.createRadialGradient(960, 540, 0, 960, 540, 1150);
  g.addColorStop(0, '#123A5E'); g.addColorStop(1, '#07111F');
  ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
  ec.clearRect(0, 0, 1920, 1080);
  K.emblem(ec, 960, 540, 1 + 0.03 * b, {});
  ctx.save(); ctx.filter = 'blur(40px)'; ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.12 * (1 + 0.5 * b); ctx.drawImage(em, 0, 0); ctx.drawImage(em, 0, 0); ctx.restore();
  ctx.save(); ctx.globalAlpha = 1 + 0.03 * Math.min(0, b); ctx.drawImage(em, 0, 0); ctx.restore();
};
</script>
</body></html>
