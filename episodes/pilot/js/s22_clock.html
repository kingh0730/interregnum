<!doctype html>
<html><head><meta charset="utf-8"><title>s22_clock</title></head>
<body>
<script src="kit_s01_s20.js"></script>
<script>window.J08_TIME = '20:59'; window.J08_TOAIR = 60; window.J08_ALARM = '1';</script>
<script src="j08_clock.js"></script>
<script>
// Shot 22 (2.0 s): J08 with time 20:59, TO AIR 01:00 → 00:59 in signal red, colon blinking (all from j08_clock.js,
// so it matches shot 14 exactly), plus the alarm frame: a 2 px #E0412F line on the inset frame whose opacity
// pulses 70 % → 30 % from every whole second (the pulse that starts under everything here).
const j08Frame = window.renderFrame;
window.renderFrame = (t) => {
  j08Frame(t);
  const ph = t - Math.floor(t + 1e-6);
  const a = 0.30 + 0.40 * Math.exp(-ph / 0.28);
  ctx.save();
  ctx.strokeStyle = `rgba(224,65,47,${a})`; ctx.lineWidth = 2;
  ctx.shadowColor = `rgba(224,65,47,${a * 0.6})`; ctx.shadowBlur = 14;
  ctx.strokeRect(41, 138 + 41, 1920 - 82, 942 - 138 - 82);
  ctx.restore();
};
</script>
</body></html>
