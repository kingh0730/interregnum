<!doctype html>
<html><head><meta charset="utf-8"><title>s11_order_j06</title></head>
<body>
<script src="kit_s01_s20.js"></script>
<script>
// Shot 11 / J06 THE ORDER: the Committee's slip, transparent, drawn in the top-left 1600×460 of the frame
// (crop to 1600×460 after rendering).
//   default:     6.0 s reveal (seal from 0; lines fade up over 0.15 s at 0.4 / 1.2 / 2.0 / 2.8 / 3.8)
//   ?layers=1:   frame i = layer i (0 seal, 1–5 the lines), for comp to reveal one at a time
//   ?paper=1:    cream paper underneath (QA only)
const { C, F } = K;
const q = new URLSearchParams(location.search);
const LAYERS = q.get('layers') === '1', PAPER = q.get('paper') === '1';
const PW = 1600, PH = 460, INK = '#1B1E24';
const LINES = [
  { s: 'NIGHT 212', size: 56 },
  { s: 'NO AGREEMENT.', size: 56 },
  { s: 'NO TEXT TONIGHT.', size: 56 },
  { s: 'LET HIM SPEAK.', size: 56 },
  { s: 'THE OPERATOR ANSWERS FOR CONTENT.', size: 38 },
];
const REVEAL = [0.4, 1.2, 2.0, 2.8, 3.8];
const ctx = K.canvas(false);

// pre-render each layer once
function typeLine(i) {
  const c = K.off(PW, PH), x = c.getContext('2d'), L = LINES[i], r = K.rng(1000 + i);
  // baselines: 1.25 line height from a top margin; the small print keeps the same rhythm
  let base = 96; for (let k = 0; k < i; k++) base += LINES[k].size * 1.25;
  if (i === 4) base += 8;
  x.font = `bold ${L.size}px ${F.courier}`; x.textBaseline = 'alphabetic'; x.fillStyle = INK;
  x.filter = 'blur(0.4px)';
  let px = 80;
  for (const ch of L.s) {
    const w = x.measureText(ch).width;
    if (ch !== ' ') {
      x.globalAlpha = 0.85 + 0.15 * r();
      const dy = Math.round((r() * 2 - 1) * 1);  // ±1 px baseline jitter
      x.fillText(ch, px + (r() - 0.5) * 0.6, base + dy);
      // faint doubled strike on a few glyphs (ribbon bleed)
      if (r() < 0.25) { x.globalAlpha = 0.18; x.fillText(ch, px + 0.6, base + dy + 0.4); }
    }
    px += w;
  }
  // ink starvation: knock a few specks out of the glyphs
  x.filter = 'none'; x.globalCompositeOperation = 'destination-out';
  for (let k = 0; k < 140 * L.s.length / 16; k++) {
    x.globalAlpha = 0.35 + 0.5 * r();
    x.beginPath(); x.arc(80 + r() * (px - 80), base - L.size * 0.75 + r() * L.size * 0.85, 0.5 + r() * 1.1, 0, 7); x.fill();
  }
  return c;
}

function seal() {
  const c = K.off(PW, PH), x = c.getContext('2d'), r = K.rng(77);
  const cx = 1420, cy = 230, R = 80;
  // smooth noise for the rough edge (sum of a few seeded sines), ±3 px
  const ph = [...Array(6)].map(() => r() * 6.283), fr = [3, 5, 8, 13, 21, 34], am = [1.1, 0.8, 0.6, 0.45, 0.35, 0.3];
  const rough = (a) => fr.reduce((s, f, k) => s + am[k] * Math.sin(f * a + ph[k]), 0) / 3.6 * 3;
  x.save(); x.translate(cx, cy); x.rotate(-8 * Math.PI / 180);
  x.beginPath();
  for (let k = 0; k <= 360; k++) { const a = (k / 360) * Math.PI * 2, rr = R + rough(a); k ? x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : x.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  x.closePath(); x.fillStyle = '#C2362A'; x.fill();
  // negative space: inner ring, flame and base line (the Lamp)
  x.globalCompositeOperation = 'destination-out';
  x.beginPath(); x.arc(0, 0, 64, 0, Math.PI * 2); x.lineWidth = 3.5; x.stroke();
  x.save(); x.scale(0.4, 0.4); x.translate(0, -10); K.flamePath(x); x.fill(); x.fillRect(-90, 66, 180, 10); x.restore();
  // uneven stamp pressure: specks and a lighter crescent
  for (let k = 0; k < 900; k++) {
    const a = r() * 6.283, d = Math.sqrt(r()) * (R + 2);
    x.globalAlpha = 0.15 + 0.5 * r() * (d > 55 ? 1.2 : 0.7) * (Math.cos(a - 0.6) > 0.3 ? 1.4 : 0.8);
    x.beginPath(); x.arc(Math.cos(a) * d, Math.sin(a) * d, 0.4 + r() * 1.3, 0, 7); x.fill();
  }
  x.restore();
  const o = K.off(PW, PH), y = o.getContext('2d');
  y.globalAlpha = 0.9; y.filter = 'blur(0.4px)'; y.drawImage(c, 0, 0);
  return o;
}

let L = null;
function build() { L = [seal(), ...LINES.map((_, i) => typeLine(i))]; }

window.renderFrame = (t) => {
  if (!L) build();
  ctx.clearRect(0, 0, 1920, 1080);
  if (PAPER) { ctx.fillStyle = '#E9E2D0'; ctx.fillRect(0, 0, PW, PH); }
  if (LAYERS) { const i = Math.min(5, K.frame(t)); ctx.drawImage(L[i], 0, 0); return; }
  if (PAPER) ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(L[0], 0, 0);
  REVEAL.forEach((t0, i) => { const a = K.seg(t, t0, t0 + 0.15); if (a > 0) { ctx.globalAlpha = a; ctx.drawImage(L[i + 1], 0, 0); ctx.globalAlpha = 1; } });
  ctx.globalCompositeOperation = 'source-over';
};
</script>
</body></html>
