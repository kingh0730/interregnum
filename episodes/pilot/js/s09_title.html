<!doctype html>
<html><head><meta charset="utf-8"><title>s09_title</title></head>
<body>
<script src="kit_s01_s20.js"></script>
<script>
// Shot 09 / J05 TITLE: CONTINUITY. 4.0 s on black; the text stays inside the letterbox band.
const { C, F } = K;
const ctx = K.canvas(true);
const WORD = 'CONTINUITY', SIZE = 140, TRACK = 0.5;
const font = `bold ${SIZE}px ${F.cond}`;
let xs = [], x0 = 0, base = 0;
function layout() {
  ctx.save(); ctx.font = font; ctx.letterSpacing = TRACK * SIZE + 'px';
  const total = ctx.measureText(WORD).width - TRACK * SIZE;
  x0 = 960 - total / 2;
  xs = [...WORD].map((_, i) => x0 + (i ? ctx.measureText(WORD.slice(0, i)).width : 0));
  const m = ctx.measureText('C');
  base = 540 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  ctx.restore();
}
window.renderFrame = (t) => {
  if (!xs.length) layout();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080);
  const f = K.frame(t);
  ctx.save(); ctx.font = font; ctx.letterSpacing = '0px'; ctx.textBaseline = 'alphabetic';
  [...WORD].forEach((ch, i) => {
    const on = K.frame(0.3 + i * 0.09); // one letter every ~2 frames, last one lands by 1.2 s
    if (f < on) return;
    const flash = f < on + 2;
    ctx.fillStyle = flash ? C.cyan : C.cream;
    ctx.shadowColor = flash ? C.cyan : 'rgba(233,226,208,0.25)'; ctx.shadowBlur = flash ? 24 : 10;
    ctx.fillText(ch, xs[i], base);
  });
  ctx.restore();
  const r = K.easeInOutCubic(K.seg(t, 1.2, 1.8));
  if (r > 0) { ctx.save(); ctx.fillStyle = C.cyan; ctx.shadowColor = C.cyan; ctx.shadowBlur = 8; ctx.fillRect(960 - 300 * r, Math.round(base + 60), 600 * r, 2); ctx.restore(); }
};
</script>
</body></html>
