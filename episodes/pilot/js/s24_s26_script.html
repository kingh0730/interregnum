<!doctype html>
<!--
  J10 `script` — shots 24 ("I …", 8.0 s) and 26 ("Eat …", 9.0 s). One page, two time ranges.
  Select the range with the URL hash: s24_s26_script.html#24  or  s24_s26_script.html#26
  window.renderFrame(t) draws shot-local time t (seconds). window.KEYS lists every keystroke
  (frame-quantized) so the sound can land on the frame; dump it to work/pilot/js/keys_24.json / keys_26.json.
-->
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#0A0F1C;overflow:hidden}
  canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const RANGE = (location.hash || '#24').slice(1) === '26' ? 26 : 24;
const FPS = 24;
const C = {
  navy:'#0A0F1C', panel:'#0D1426', line:'#1E2A44', cyan:'#5FE1E6', amber:'#F2A441',
  red:'#E0412F', cream:'#E9E2D0',
};
const rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const rgba = (h, a) => { const [r,g,b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
const mix = (h1, h2, k, a=1) => { const A=rgb(h1), B=rgb(h2);
  return `rgba(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')},${a})`; };
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const easeInOutCubic = x => x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const q = t => Math.round(t*FPS)/FPS;               // snap to a frame
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const F_MONO = '50px Menlo', F_TAG = '20px Menlo';
const F_HEAD = "bold 26px 'DIN Alternate'", F_VIEW = "bold 22px 'DIN Alternate'", F_STAT = "bold 24px 'DIN Alternate'";

// ---- layout -------------------------------------------------------------------------------------------
const FIELD = {x0:200, x1:1720, y0:250, y1:820};
const TX = 290;                        // text column; the gutter 200–290 holds the lock glyph
const LINE_Y = i => 302 + i*80;        // vertical centre of line i (0-based), line height 80
const HEAD_Y = 170;

// ---- timelines ----------------------------------------------------------------------------------------
const KEYS = [];      // {t, frame, abs, key, kind}
const ABS0 = RANGE === 24 ? 125.0 : 136.0;
function key(t, k, kind='char'){ t = q(t); KEYS.push({t:+t.toFixed(4), frame:Math.round(t*FPS), abs:+(ABS0+t).toFixed(4), key:k, kind}); }

let LINES0, TARGET_LINE;
if (RANGE === 24) {
  LINES0 = ['Good evening, my children.'];
  key(0.6, 'I');
  key(2.8, ' ');
  ['d','i','e','d'].forEach((ch,i) => key(3.0 + i*0.15, ch));
  // " in the spring." — 15 keystrokes, ~0.12 s ±30 % jitter, spanning exactly 3.8 → 5.6
  const s = ' in the spring.', r = mulberry32(212);
  const gaps = []; for (let i=0;i<s.length-1;i++) gaps.push(0.12*(1+(r()*2-1)*0.3));
  const sum = gaps.reduce((a,b)=>a+b,0); let tt = 3.8;
  for (let i=0;i<s.length;i++){ key(tt, s[i]); if (i<gaps.length) tt += gaps[i]*(1.8/sum); }
} else {
  LINES0 = ['Good evening, my children.', 'I died in the spring.', "I'm sorry I stayed so long.",
            "Tomorrow, you'll have to talk to each other."];
  key(1.00,'E'); key(1.225,'a'); key(1.45,'t');
  key(4.0, 'TAB', 'tab');
  key(4.5, 'ENTER', 'enter');
  '[EYES CLOSE]'.split('').forEach((ch,i) => key(4.8 + i*0.11, ch));
}
window.KEYS = KEYS;
const lastKeyBefore = t => { let lk = 0; for (const k of KEYS) if (k.t <= t + 1e-6) lk = k.t; return lk; };

// Cursor: solid while typing, then 0.5 s on / 0.5 s off.
function cursorOn(t){ const since = t - lastKeyBefore(t); return Math.floor(since/0.5) % 2 === 0; }

// ---- drawing helpers ----------------------------------------------------------------------------------
function text(str, x, y, font, color, {align='left', glow=0, glowColor=null, spacing=0, alpha=1}={}){
  ctx.save();
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.letterSpacing = spacing + 'px';
  ctx.globalAlpha = alpha;
  if (glow){ ctx.shadowBlur = glow; ctx.shadowColor = glowColor || color; }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.restore();
}
function w(str, font){ ctx.save(); ctx.font = font; ctx.letterSpacing='0px'; const m = ctx.measureText(str).width; ctx.restore(); return m; }

function lockGlyph(cx, cy, s, color){
  // a small padlock: shackle arc + body
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = Math.max(1.5, s*0.13);
  ctx.beginPath(); ctx.arc(cx, cy - s*0.12, s*0.26, Math.PI, 0); ctx.lineTo(cx + s*0.26, cy + s*0.05);
  ctx.moveTo(cx - s*0.26, cy - s*0.12); ctx.lineTo(cx - s*0.26, cy + s*0.05); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(cx - s*0.40, cy + s*0.02, s*0.80, s*0.58, s*0.08); ctx.fill();
  ctx.restore();
}

function header(t){
  text('SCRIPT · NIGHT 212 · 21:00', FIELD.x0, HEAD_Y, F_HEAD, rgba(C.cyan,0.70), {spacing:1.5, glow:6, glowColor:rgba(C.cyan,0.25)});
  const secs = (RANGE===24 ? 53 : 32) - Math.floor(t + 1e-6);
  const toAir = 'TO AIR 00:' + String(secs).padStart(2,'0');
  text(toAir, FIELD.x1, HEAD_Y, F_HEAD, C.red, {align:'right', spacing:1.5, glow:8, glowColor:rgba(C.red,0.45)});
  // COMMITTEE — VIEWING
  let a = 0, ph = 0;
  if (RANGE === 24){ if (t >= 5.8){ a = clamp((t-5.8)/0.3); ph = (t-5.8) % 1; } }
  else { a = 1; ph = (t + 0.2) % 1; }            // phase continues across the cut (appeared at abs 130.8)
  if (a > 0){
    const on = ph < 0.5;
    const label = 'COMMITTEE — VIEWING';
    const lx = FIELD.x1, ly = HEAD_Y + 38;
    text(label, lx, ly, F_VIEW, C.red, {align:'right', spacing:1.2, alpha:a*(on?1:0.55), glow:on?8:0, glowColor:rgba(C.red,0.5)});
    const lw = w(label, F_VIEW) + label.length*1.2;
    if (on){ ctx.save(); ctx.globalAlpha = a; ctx.shadowBlur = 10; ctx.shadowColor = C.red; ctx.fillStyle = C.red;
      ctx.beginPath(); ctx.arc(lx - lw - 16, ly - 1, 6, 0, Math.PI*2); ctx.fill(); ctx.restore(); }
  }
}

function field(borderK){
  ctx.save();
  ctx.fillStyle = C.panel; ctx.fillRect(FIELD.x0, FIELD.y0, FIELD.x1-FIELD.x0, FIELD.y1-FIELD.y0);
  // faint inner falloff so the panel reads as a lit surface, not a flat box
  const g = ctx.createRadialGradient(960, 520, 100, 960, 520, 1000);
  g.addColorStop(0, 'rgba(95,225,230,0.018)'); g.addColorStop(1, 'rgba(0,0,0,0.10)');
  ctx.fillStyle = g; ctx.fillRect(FIELD.x0, FIELD.y0, FIELD.x1-FIELD.x0, FIELD.y1-FIELD.y0);
  ctx.lineWidth = 1;
  ctx.strokeStyle = borderK > 0 ? mix(C.line, C.cyan, borderK, 1 - 0.4*borderK) : C.line;
  if (borderK > 0){ ctx.shadowBlur = 12*borderK; ctx.shadowColor = rgba(C.cyan, 0.35*borderK); }
  ctx.strokeRect(FIELD.x0 + 0.5, FIELD.y0 + 0.5, FIELD.x1-FIELD.x0-1, FIELD.y1-FIELD.y0-1);
  ctx.restore();
}

const CREAM_GLOW = {glow:7, glowColor:'rgba(233,226,208,0.22)'};
function line(i, str, color=C.cream, opts={}){ text(str, TX, LINE_Y(i), F_MONO, color, Object.assign({}, CREAM_GLOW, opts)); }

function cursorAt(i, str, t, show=true){
  if (!show || !cursorOn(t)) return;
  const x = TX + w(str, F_MONO) - 2;
  ctx.save(); ctx.fillStyle = C.cream; ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(233,226,208,0.5)';
  ctx.fillRect(Math.round(x), LINE_Y(i) - 30, 4, 60); ctx.restore();
}

function tag(str, color, alpha=1, glow=6){
  text(str, TX, 862, F_TAG, color, {spacing:2, alpha, glow, glowColor:color});
}

function vignette(){
  const g = ctx.createRadialGradient(960, 540, 500, 960, 540, 1150);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = g; ctx.fillRect(0,0,1920,1080);
}

const typedAt = t => KEYS.filter(k => k.t <= t + 1e-6 && k.kind === 'char').map(k => k.key).join('');

// ---- shot 24 ------------------------------------------------------------------------------------------
function draw24(t){
  const f = Math.round(t*FPS);
  field(0);
  lockGlyph(245, LINE_Y(0) - 4, 30, rgba(C.cream, 0.40));
  line(0, LINES0[0], rgba(C.cream,0.40), {glow:0});
  const typed = typedAt(t);
  line(1, typed);
  const tw = w(typed, F_MONO);
  // ghost prediction
  if (t >= 0.9 && t < 3.0){
    const ghost = typed.endsWith(' ') ? 'am well.' : ' am well.';
    const breathe = 0.30 + 0.05*Math.sin(2*Math.PI*0.5*(t - 0.9));
    text(ghost, TX + tw + 3, LINE_Y(1), F_MONO, rgba(C.cream, breathe), {glow:4, glowColor:'rgba(233,226,208,0.12)'});
  } else if (t >= 3.0 && t < 3.2){
    const k = f - 72;                              // 0..4
    if (k <= 1){
      // two-frame flicker: the ghost tears sideways and strobes
      const a = k === 0 ? 0.55 : 0.12;
      ctx.save(); ctx.beginPath(); ctx.rect(0, LINE_Y(1) - 40, 1920, 40); ctx.clip();
      text(' am well.', TX + tw + (k===0? 14 : -9), LINE_Y(1), F_MONO, rgba(C.cream, a));
      ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.rect(0, LINE_Y(1), 1920, 40); ctx.clip();
      text(' am well.', TX + tw + (k===0? -6 : 11), LINE_Y(1), F_MONO, rgba(C.cream, a*0.8));
      ctx.restore();
    } else {
      // " am we—" breaking up: characters drop out from the right, the rest fades
      const s = ' am we—', keep = s.length - (k-2)*2, fade = [0.30, 0.20, 0.10][k-2];
      let x = TX + tw;
      for (let i=0;i<s.length;i++){
        const cw = w(s[i], F_MONO);
        if (i < keep) text(s[i], x, LINE_Y(1) + (i%2 ? (k-1) : 0), F_MONO, rgba(C.cream, fade * (i===keep-1 ? 0.5 : 1)));
        x += cw;
      }
    }
  }
  cursorAt(1, typed, t);
  // prediction tag
  if (t >= 0.9 && t < 3.0) tag('PREDICTION 0.99', C.cyan, 1);
  else if (t >= 3.0 && t < 3.2){
    const vals = ['0.99','0.61','0.28','0.09','0.02'];
    tag('PREDICTION ' + vals[clamp(f-72,0,4)], C.cyan, (f%2) ? 0.55 : 0.9);
  } else if (t >= 3.2) tag('NO PREDICTION', C.red, clamp((t-3.2)/0.08), 8);
}

// ---- shot 26 ------------------------------------------------------------------------------------------
function draw26(t){
  const locked = t >= 6.6;
  const lockK = locked ? easeInOutCubic(clamp((t-6.6)/0.25)) : 0;
  field(lockK*0.6/0.6);
  lockGlyph(245, LINE_Y(0) - 4, 30, rgba(C.cream, 0.40));
  line(0, LINES0[0], rgba(C.cream,0.40), {glow:0});
  for (let i=1;i<4;i++) line(i, LINES0[i]);

  const typed = typedAt(t);                  // "Eat" then (after ENTER) "[EYES CLOSE]" chars
  const PRED = ' something warm before you sleep.';
  const committed = t >= 4.0 - 1e-6;
  const l5typed = typed.slice(0, 3);
  const l5 = committed ? 'Eat' + PRED : l5typed;
  const l6 = t >= 4.5 - 1e-6 ? typed.slice(3) : null;

  if (!committed){
    line(4, l5typed);
    if (t >= 1.7){
      const u = clamp((t - 1.7)/0.25);
      const breathe = 0.55 + 0.10*Math.sin(2*Math.PI*0.5*(t - 1.7));
      const a = breathe * (u*u*(3-2*u));
      text(PRED, TX + w(l5typed, F_MONO) + 3, LINE_Y(4), F_MONO, rgba(C.amber, a), {glow:8, glowColor:rgba(C.amber, 0.9*u)});
    }
    cursorAt(4, l5typed, t);
  } else {
    // committed line, with the 0.3 s amber sweep (4.0–4.3) running left → right
    const sw = clamp((t - 4.0)/0.3);
    const x0 = TX, x1 = TX + w(l5, F_MONO);
    const head = x0 - 60 + (x1 - x0 + 160) * easeInOutCubic(sw);
    let x = x0;
    for (let i=0;i<l5.length;i++){
      const cw = w(l5[i], F_MONO), cx = x + cw/2, d = head - cx;
      // bright at the head, a short warm tail behind it, nothing ahead
      let k = 0;
      if (t < 4.3 + 0.35){ k = d >= 0 ? Math.exp(-d/140) : Math.exp(-(d*d)/(2*25*25)); }
      if (t >= 4.3) k *= clamp(1 - (t - 4.3)/0.35);
      const col = mix(C.cream, C.amber, clamp(k), 1);
      text(l5[i], x, LINE_Y(4), F_MONO, col, {glow: 7 + 10*k, glowColor: k > 0.05 ? rgba(C.amber, 0.8*k) : 'rgba(233,226,208,0.22)'});
      x += cw;
    }
    if (sw > 0 && sw < 1){
      // soft light passing along the line
      const g = ctx.createRadialGradient(head, LINE_Y(4), 0, head, LINE_Y(4), 120);
      g.addColorStop(0, rgba(C.amber, 0.16*Math.sin(Math.PI*sw))); g.addColorStop(1, rgba(C.amber, 0));
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g;
      ctx.fillRect(head - 130, LINE_Y(4) - 130, 260, 260); ctx.restore();
    }
    if (l6 === null) cursorAt(4, l5, t, !locked);
  }
  if (l6 !== null){
    line(5, l6, C.cyan, {glow:7, glowColor:rgba(C.cyan,0.30)});
    cursorAt(5, l6, t, !locked);
  }

  // prediction tag
  if (t >= 1.7 && t < 4.3){
    const a = clamp((t-1.7)/0.25) * (t >= 4.0 ? clamp(1 - (t-4.0)/0.3) : 1);
    tag('PREDICTION 0.97', C.amber, a, 8);
  }
  // status
  if (locked){
    const a = clamp((t-6.6)/0.2);
    lockGlyph(TX + 9, 777, 20, rgba(C.cyan, a));
    text('SCRIPT LOCKED · 6 LINES', TX + 34, 780, F_STAT, C.cyan, {spacing:2, alpha:a, glow:8, glowColor:rgba(C.cyan,0.45)});
  }
}

window.renderFrame = (t) => {
  ctx.fillStyle = C.navy; ctx.fillRect(0,0,1920,1080);
  header(t);
  if (RANGE === 24) draw24(t); else draw26(t);
  vignette();
};
window.ready = (async () => {
  await Promise.all([F_MONO, F_TAG, F_HEAD, F_VIEW, F_STAT].map(f => document.fonts.load(f, 'ABC abc 0123 —·●')));
})();
</script></body></html>
