<!doctype html>
<html><head><meta charset="utf-8"><title>j14_bug</title></head>
<body>
<script src="kit_s01_s20.js"></script>
<script>
// J14 broadcast bug (shared overlay, transparent, static): the Lamp at 60 px, top-left (70, 60), 60 %;
// LIVE in DIN Alternate Bold 26 px cream at (1790, 1010) (left edge, baseline). Used by shots 02, 03, 29, 31.
const ctx = K.canvas(false);
window.renderFrame = () => {
  ctx.clearRect(0, 0, 1920, 1080);
  const s = 60 / 310; // circle outer diameter (r150 + 5 px stroke) fits 60 px
  ctx.save(); ctx.globalAlpha = 0.6;
  K.emblem(ctx, 70 + 30, 60 + 30, s, {});
  ctx.restore();
  K.text(ctx, 'LIVE', 1790, 1010, { font: K.F.alt, weight: 'bold', size: 26, color: K.C.cream, track: 0.12 });
};
</script>
</body></html>
