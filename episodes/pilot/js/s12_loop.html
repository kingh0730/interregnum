<!doctype html>
<html><head><meta charset="utf-8"><title>s12_loop</title></head>
<body>
<script src="kit_s01_s20.js"></script>
<script src="mesh_k02.js"></script>
<script src="env_voice.js"></script>
<script>
// Shot 12 / J07 THE LOOP. 8.0 s, opaque, inside the band. FREE GENERATION: the prose streams in (0.3–3.5 s), then
// only "I am well." (onsets 3/s → ~14.3/s by 7.0, the D07 choir's schedule), overflow tiles 6.0–7.4, STOP at 7.4.
const { C, F } = K;
const ctx = K.canvas(true);
let IMG = null, M = null;
window.ready = K.loadImage(K.K02_CANDS).then((r) => { IMG = r; M = K.mesh(r && r.src); });
const STOP_T = 7.4;

// ---------- the token stream ----------
const PROSE = 'Good evening, my children. The harvest is in. The sea is calm. I am well. Sleep safely; I am watching over you. I am well. The sea is calm.';
const words = PROSE.split(' ');
const TOK = []; // {s, t, end (phrase end)}
{
  const r = K.rng(1207), iv = words.map(() => 1 + (r() * 2 - 1) * 0.3), sum = iv.reduce((a, b) => a + b, 0);
  let t = 0.3;
  words.forEach((w, i) => { TOK.push({ s: w, t, end: /[.;]$/.test(w) && !/;$/.test(w) }); t += (iv[i] / sum) * (3.45 - 0.3); });
}
// loop onsets: rate 3/s at 3.5 rising linearly to 1/0.07 s at 7.0, then held
const R0 = 3, R1 = 1 / 0.07;
const Nloop = (t) => { const u = t - 3.5; if (u < 0) return 0; if (u <= 3.5) return R0 * u + (R1 - R0) * u * u / 7; return R0 * 3.5 + (R1 - R0) * 3.5 / 2 + R1 * (u - 3.5); };
const ONSETS = [];
for (let k = 0; ; k++) { let lo = 3.5, hi = 9; for (let j = 0; j < 50; j++) { const m = (lo + hi) / 2; Nloop(m) < k ? (lo = m) : (hi = m); } if (hi >= STOP_T) break; ONSETS.push(k === 0 ? 3.5 : hi); }
window.S12_LOOP_ONSETS = ONSETS;
for (const t of ONSETS) TOK.push({ s: 'I am well.', t, end: true });

// ---------- layout (greedy wrap, append-only so lines never reflow) ----------
const TX0 = 712, TX1 = 1652, LH = 50, TSIZE = 34;
let LINES = null; // [{toks:[{s,t,end,x}], pT: time of first phrase end on the line}]
function layout() {
  ctx.save(); ctx.font = `${TSIZE}px ${F.mono}`;
  const sp = ctx.measureText(' ').width;
  LINES = []; let cur = { toks: [], w: 0 };
  for (const tk of TOK) {
    const w = ctx.measureText(tk.s).width;
    const need = cur.toks.length ? cur.w + sp + w : w;
    if (need > TX1 - TX0 && cur.toks.length) { LINES.push(cur); cur = { toks: [], w: 0 }; }
    tk.x = cur.toks.length ? cur.w + sp : 0;
    cur.w = tk.x + w; cur.toks.push(tk);
  }
  LINES.push(cur);
  for (const L of LINES) { const e = L.toks.find((k) => k.end); L.pT = e ? e.t : Infinity; L.t0 = L.toks[0].t; }
  ctx.restore();
}

// ---------- voice amplitude (for the live waveform) ----------
const env = (E, tt) => { if (tt < 0 || tt >= E.dur) return 0; return E.v[Math.min(E.v.length - 1, Math.floor(tt * E.rate))]; };
const amp = (t) => {
  const EV = window.ENV_VOICE;
  let a = env(EV.d06, t - 0.3) * (t < 3.5 ? 1 : Math.max(0.25, 1 - (t - 3.5) / 2));
  for (const o of ONSETS) if (t >= o) a += 0.55 * env(EV.iamwell, t - o);
  return Math.tanh(a * 1.1);
};

// ---------- scene ----------
function panels() {
  ctx.save(); ctx.fillStyle = C.panel; ctx.globalAlpha = 0.6;
  ctx.fillRect(680, 230, 1180, 620);
  ctx.restore();
  K.frameRect(ctx, 680, 230, 1180, 620, C.line);
}

function preview(t) {
  const X = 60, Y = 230, W = 560, H = 315;
  ctx.save(); ctx.beginPath(); ctx.rect(X, Y, W, H); ctx.clip();
  if (IMG) ctx.drawImage(IMG.img, X, Y, W, H);
  K.drawMesh(ctx, M, { scale: W / 1920, ox: X, oy: Y, lineA: 0.55 * 0.2 / 0.55 * 0.55, dotA: 0.2, lineW: 1, dotR: 1.2 });
  ctx.restore();
  K.frameRect(ctx, X, Y, W, H, C.line);
  K.text(ctx, 'SUBJECT F · PREVIEW', X, Y + H + 30, { font: F.alt, weight: 'bold', size: 16, color: C.cyan, alpha: 0.55, track: 0.12 });
  // live waveform 560×60 (history scrolls left, now = right edge)
  const WY = Y + H + 50, WH = 60, mid = WY + WH / 2;
  ctx.save(); ctx.fillStyle = C.line; ctx.fillRect(X, mid, W, 1); ctx.restore();
  ctx.save(); ctx.fillStyle = C.cyan; ctx.shadowColor = C.cyan; ctx.shadowBlur = 6;
  const span = 2.4; // seconds of history
  for (let i = 0; i < 140; i++) {
    const x = X + i * 4;
    const tt = t - span + (i / 140) * span;
    if (tt < 0) continue;
    const q = Math.floor(tt * 24 * 4); // stable per-bar jitter
    const a = amp(tt) * (0.55 + 0.45 * K.hash(q, 5));
    const h = Math.max(1, a * WH * 0.5);
    ctx.globalAlpha = 0.35 + 0.65 * (i / 140);
    ctx.fillRect(x, mid - h, 2, h * 2);
  }
  ctx.restore();
  K.text(ctx, 'VOICE · LIVE', X, WY + WH + 34, { font: F.alt, weight: 'bold', size: 16, color: C.cyan, alpha: 0.55, track: 0.12 });
}

function textPanel(t) {
  if (!LINES) layout();
  K.text(ctx, 'OUTPUT', 712, 270, { font: F.alt, weight: 'bold', size: 18, color: C.cyan, alpha: 0.6, track: 0.14 });
  K.text(ctx, 'CONFIDENCE', 1830, 270, { font: F.alt, weight: 'bold', size: 18, color: C.cyan, alpha: 0.6, track: 0.14, align: 'right' });
  K.rule(ctx, 712, 286, 1830, C.line);
  const TOP = 340, VIS = 10;
  // continuous scroll: current line index + fraction of that line written
  let li = 0; for (let i = 0; i < LINES.length; i++) if (LINES[i].t0 <= t) li = i;
  const L = LINES[li], shown = L.toks.filter((k) => k.t <= t);
  const frac = shown.length ? (shown[shown.length - 1].x + 1) / (TX1 - TX0) : 0;
  const target = Math.max(0, li + K.clamp(frac * 1.2) - (VIS - 1));
  const off = target * LH;
  ctx.save(); ctx.beginPath(); ctx.rect(681, 296, 1178, 548); ctx.clip();
  ctx.font = `${TSIZE}px ${F.mono}`; ctx.textBaseline = 'alphabetic';
  let lastX = TX0, lastY = TOP;
  LINES.forEach((Ln, i) => {
    const y = TOP + i * LH - off;
    if (y < 250 || y > 900) return;
    for (const k of Ln.toks) {
      if (k.t > t) break;
      const fresh = K.clamp((t - k.t) / 0.12), edge = K.clamp((y - 296) / 40);
      ctx.fillStyle = fresh < 1 ? C.core : C.cream; ctx.globalAlpha = (0.6 + 0.4 * fresh) * edge;
      ctx.fillText(k.s, TX0 + k.x, y);
      lastX = TX0 + k.x + ctx.measureText(k.s).width; lastY = y;
    }
    ctx.globalAlpha = 1;
    if (Ln.pT <= t) K.text(ctx, 'P = 0.99', 1830, y - 4, { font: F.mono, size: 20, color: C.cyan, align: 'right', alpha: K.clamp((y - 296) / 40) });
  });
  // cursor block
  if (t >= 0.3 && t < STOP_T) { ctx.fillStyle = C.cream; ctx.globalAlpha = 0.85; ctx.fillRect(lastX + 8, lastY - 27, 17, 33); }
  ctx.restore();
}

function overflow(t) {
  if (t < 6.0) return;
  const tt = Math.min(t, STOP_T) - 6.0;
  const y0 = 600 * tt + (900 / (2 * 1.4)) * tt * tt; // 600 → 1500 px/s over 1.4 s
  const a = 0.25 * K.easeOutCubic(K.clamp(tt / 0.25));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 138, 1920, 804); ctx.clip();
  ctx.font = `60px ${F.cond}`; ctx.letterSpacing = '6px'; ctx.fillStyle = C.cyan; ctx.globalAlpha = a; ctx.textBaseline = 'alphabetic';
  const w = ctx.measureText('I AM WELL.').width + 48, rowH = 70;
  const first = Math.floor((138 + y0) / rowH) - 1;
  for (let r = first; r < first + 14; r++) {
    const y = r * rowH - y0 + 60;
    const shift = (((r % 2) + 2) % 2) * (w / 2);
    for (let x = -w + shift; x < 1920 + w; x += w) ctx.fillText('I AM WELL.', x, y);
  }
  ctx.restore();
}

function scene(t) {
  ctx.fillStyle = C.navy; ctx.fillRect(0, 0, 1920, 1080);
  overflow(t);
  K.topBar(ctx, { t, clock0: K.parseHMS('20:53:40'), toAir0: 6 * 60 + 20, mode: { text: 'FREE GENERATION', color: C.red }, frozen: t >= STOP_T });
  panels();
  preview(t);
  textPanel(t);
}

const frozen = K.off(1920, 1080);
window.renderFrame = (t) => {
  ctx.globalAlpha = 1; ctx.filter = 'none';
  if (t < STOP_T) { scene(t); return; }
  // freeze on the 7.4 s state, dim everything to 30 % over 0.3 s, STOP flashes 2 on / 2 off twice, then holds
  scene(STOP_T - 1e-4);
  const fx = frozen.getContext('2d'); fx.clearRect(0, 0, 1920, 1080); fx.drawImage(ctx.canvas, 0, 0);
  const d = K.lerp(1, 0.3, K.easeOutCubic(K.seg(t, STOP_T, STOP_T + 0.3)));
  ctx.fillStyle = C.navy; ctx.fillRect(0, 0, 1920, 1080);
  ctx.globalAlpha = d; ctx.drawImage(frozen, 0, 0); ctx.globalAlpha = 1;
  const f = K.frame(t) - K.frame(STOP_T);
  const on = f >= 8 || (f % 4) < 2;
  if (on) {
    ctx.save(); ctx.font = `bold 40px ${F.cond}`; ctx.letterSpacing = '8px';
    const w = ctx.measureText('STOP').width - 8, sq = 22, gap = 16, total = sq + gap + w;
    const x0 = 960 - total / 2, base = 540 + 14;
    ctx.fillStyle = 'rgba(10,15,28,0.85)'; ctx.fillRect(x0 - 36, 540 - 38, total + 72, 76);
    ctx.strokeStyle = C.red; ctx.lineWidth = 1; ctx.globalAlpha = 0.6; ctx.strokeRect(x0 - 36 + 0.5, 540 - 38 + 0.5, total + 71, 75); ctx.globalAlpha = 1;
    ctx.fillStyle = C.red; ctx.shadowColor = C.red; ctx.shadowBlur = 14;
    ctx.fillRect(x0, 540 - sq / 2, sq, sq);
    ctx.fillText('STOP', x0 + sq + gap, base);
    ctx.restore();
  }
};
</script>
</body></html>
