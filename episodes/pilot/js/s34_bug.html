<!doctype html>
<html><head><meta charset="utf-8"><title>s34_bug</title></head>
<body>
<script src="kit_s01_s20.js"></script>
<script>
// Shot 34 variant of the J14 broadcast bug (transparent overlay, 6.0 s): identical to j14_bug.html
// (the Lamp at 60 px, top-left (70, 60), 60 %; LIVE in DIN Alternate Bold 26 px cream at (1790, 1010)),
// except that LIVE blinks out at 5.6 s and does not return. The emblem stays.
const ctx = K.canvas(false);
window.renderFrame = (t) => {
  ctx.clearRect(0, 0, 1920, 1080);
  const s = 60 / 310;
  ctx.save(); ctx.globalAlpha = 0.6;
  K.emblem(ctx, 70 + 30, 60 + 30, s, {});
  ctx.restore();
  if (t < 5.6 - 1e-6)
    K.text(ctx, 'LIVE', 1790, 1010, { font: K.F.alt, weight: 'bold', size: 26, color: K.C.cream, track: 0.12 });
};
</script>
</body></html>
