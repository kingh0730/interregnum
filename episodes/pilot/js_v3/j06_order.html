<!doctype html>
<!--
  J06 v3 · shot 11 · the Committee's carbon copy on onionskin. Static layers on a 1600×480 slip (the slip's aspect),
  drawn at the page's top-left (0,0)–(1600,480); everything else is transparent.
  ?layer=form    red-ink pre-printed form (#CC3A2B): double rule, F-12 box in State Capitals (module 3), guide rules
  ?layer=typing  Committee Typewriter carbon (#1E2433) from Rockwell Bold, with its fixed faults
  ?layer=stamp   the Sealed Lamp rubber stamp, 150 px, −8°, uneven ink, dry edge, 1 px double strike
  ?layer=all     every layer (transparent); ?layer=preview puts them on an onionskin card for QA only
  Comp multiplies each layer onto the slip (k06) by its 4 corners, plus 0.6 px blur. All five lines from frame one.
  Render (per layer): node tools/web/render.mjs 'episodes/pilot/js_v3/j06_order.html?layer=form' work/pilot/js_v3/j06_form/ 0.0417 24
                      then ffmpeg -i …/00000.png -vf crop=1600:480:0:0 work/pilot/js_v3/j06_form.png
-->
<html><head><meta charset="utf-8"><title>J06 Order</title>
<style>@font-face{font-family:CT;src:local('Rockwell Bold'),local('Rockwell-Bold');font-weight:700}</style></head><body>
<script src="kit.js"></script>
<script>
const LAYER = K.param('layer', 'all');
const out = K.stage('transparent'), o = out.getContext('2d');
const SW = 1600, SH = 480, RED = '#CC3A2B', CARBON = '#1E2433';
const LINES = ['NIGHT 212', 'NO AGREEMENT.', 'NO TEXT TONIGHT.', 'LET HIM SPEAK.', '', 'THE OPERATOR ANSWERS FOR CONTENT.'];
const CAP = 38, ADV = 33, PITCH = 64, LEFT = 90, BASE0 = 104;

function layerCanvas() { return K.canvas(SW, SH); }
function roughen(c, amt, seed, scale = 1) { // uneven ink: knock out a noise pattern
  const n = K.noiseCanvas(400, 400, seed, { octaves: [[2 * scale, 1], [6 * scale, .8], [1, .5]] });
  const x = c.getContext('2d'); x.save(); x.globalCompositeOperation = 'destination-out'; x.globalAlpha = amt;
  // contrast the noise: only its light half removes ink
  const m = K.canvas(400, 400), mc = m.getContext('2d'); mc.filter = 'contrast(2.2) brightness(0.8)'; mc.drawImage(n, 0, 0);
  x.fillStyle = x.createPattern(m, 'repeat'); x.fillRect(0, 0, c.width, c.height); x.restore();
}

// ── the form: printed red ink ──
function drawForm() {
  const cv = layerCanvas(), c = cv.getContext('2d'); c.fillStyle = RED;
  c.fillRect(40, 22, SW - 80, 3.2); c.fillRect(40, 30, SW - 80, 1.4);                 // the double rule
  c.strokeStyle = RED; c.lineWidth = 1.6; c.strokeRect(1432, 44, 128, 44);             // form-number box
  K.capsFill(c, 'F-12', 1496, 57, 3, { align: 'center', color: RED });
  c.globalAlpha = .3; c.lineWidth = 1;                                                  // faint guide rules
  for (let i = 0; i < 7; i++) { const y = BASE0 + i * PITCH + 7.5; c.beginPath(); c.moveTo(70, y); c.lineTo(1380, y); c.stroke(); }
  c.globalAlpha = 1;
  c.fillRect(40, SH - 26, SW - 80, 1.4);                                                 // foot rule
  roughen(cv, .35, 17, 1);
  return cv;
}

// ── the Committee Typewriter ──
let FS = 54, ASC = 38;
const cell = K.canvas(80, 100), cc = cell.getContext('2d');
function typeGlyph(c, ch, x, base, dens) {
  // each strike is rendered in its own cell (so a fault never touches a neighbour), then laid on the line
  cc.clearRect(0, 0, 80, 100); const B = 72, cx = 40;
  cc.save(); cc.fillStyle = CARBON; cc.strokeStyle = CARBON;
  if (ch === '.') {                                                    // the full stop punches through the onionskin
    cc.beginPath(); cc.arc(cx - 3, B - 3.5, 4.4, 0, 7); cc.fill();
    cc.globalCompositeOperation = 'destination-out'; cc.beginPath(); cc.ellipse(cx - 2.6, B - 3.7, 2.5, 2.1, .4, 0, 7); cc.fill();
    cc.globalCompositeOperation = 'source-over'; cc.fillStyle = 'rgba(30,36,51,.7)';
    cc.beginPath(); cc.moveTo(cx - 5, B - 1); cc.lineTo(cx - 2, B + 2.5); cc.lineTo(cx, B - 1.2); cc.fill();
  } else {
    cc.font = `700 ${FS}px CT, Rockwell`; cc.textAlign = 'center'; cc.textBaseline = 'alphabetic';
    const w = cc.measureText(ch).width, sx = Math.min(1, (ADV - 3) / (w + 2.4));
    cc.translate(cx, 0); cc.scale(sx, 1); cc.translate(-cx, 0);
    cc.lineWidth = 2.4; cc.lineJoin = 'round';                           // 1.2 px ink spread thickens the serifs
    cc.strokeText(ch, cx, B); cc.fillText(ch, cx, B);
    cc.setTransform(1, 0, 0, 1, 0, 0);
    if (ch === 'O') { cc.beginPath(); cc.ellipse(cx, B - ASC / 2, (ADV - 3) * .3, ASC * .34, 0, 0, 7); cc.fill(); }   // clogged solid
    if (ch === 'T') { cc.globalCompositeOperation = 'destination-out'; cc.globalAlpha = .6; cc.fillRect(0, B - ASC - 8, cx - 3.2, ASC * .3 + 8); }
  }
  cc.restore();
  c.save(); c.globalAlpha = dens; c.drawImage(cell, x + ADV / 2 - 40, base - B + (ch === 'E' ? -3 : 0)); c.restore();  // the E strikes 3 px high
}
function drawTyping() {
  const cv = layerCanvas(), c = cv.getContext('2d'), rnd = K.rng(212);
  // measure the face so the cap height is 38 px
  c.font = `700 100px CT, Rockwell`; const m = c.measureText('H'); FS = 100 * CAP / m.actualBoundingBoxAscent; ASC = CAP;
  const sharp = layerCanvas(), s = sharp.getContext('2d');
  LINES.forEach((L, i) => {
    const base = BASE0 + i * PITCH; [...L].forEach((ch, k) => {
      if (ch === ' ') return; typeGlyph(s, ch, LEFT + k * ADV + (rnd() - .5) * 1.2, base + (rnd() - .5) * 1.4, .7 + rnd() * .3);
    });
  });
  roughen(sharp, .22, 41, .6);
  // carbon: the slipped ghost 1 px down, then the soft-edged strike
  c.globalAlpha = .28; c.filter = 'blur(1.2px)'; c.drawImage(sharp, 0, 1.2);
  c.globalAlpha = 1; c.filter = 'blur(0.75px)'; c.drawImage(sharp, 0, 0); c.filter = 'none';
  c.globalAlpha = .35; c.drawImage(sharp, 0, 0); c.globalAlpha = 1;               // keep a denser core
  return cv;
}

// ── the Sealed Lamp stamp ──
function drawStamp() {
  const cv = layerCanvas(), c = cv.getContext('2d');
  const S = 150 / 479, cx = 1400, cy = 330;
  const one = K.canvas(SW, SH), oc = one.getContext('2d');
  oc.translate(cx, cy); oc.rotate(-8 * Math.PI / 180); K.sealedLamp(oc, 0, 0, S, RED); oc.setTransform(1, 0, 0, 1, 0, 0);
  // uneven ink and a dry edge: the lower-right of the stamp barely inked
  roughen(one, .38, 77, .5);
  oc.save(); oc.globalCompositeOperation = 'destination-out';
  const g = oc.createLinearGradient(cx - 40, cy - 40, cx + 80, cy + 80);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.55, 'rgba(0,0,0,.15)'); g.addColorStop(1, 'rgba(0,0,0,.8)');
  oc.fillStyle = g; oc.fillRect(0, 0, SW, SH); oc.restore();
  c.globalAlpha = .45; c.drawImage(one, 1, -.6);                                     // the 1 px double strike
  c.globalAlpha = 1; c.filter = 'blur(0.4px)'; c.drawImage(one, 0, 0); c.filter = 'none';
  return cv;
}

function onionskin() {
  const cv = K.canvas(SW, SH), c = cv.getContext('2d');
  c.fillStyle = '#E4E2D8'; c.fillRect(0, 0, SW, SH);
  const n = K.noiseCanvas(400, 400, 5, { octaves: [[1, 1], [9, .5], [40, .4]] });
  c.globalAlpha = .18; c.globalCompositeOperation = 'multiply'; c.fillStyle = c.createPattern(n, 'repeat'); c.fillRect(0, 0, SW, SH);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; return cv;
}

window.ready = (async () => {
  await document.fonts.load('700 54px CT');
  window.L = { form: drawForm(), typing: drawTyping(), stamp: drawStamp() };
})();
window.renderFrame = async t => {
  await window.ready; o.clearRect(0, 0, 1920, 1080);
  if (LAYER === 'preview') {
    o.fillStyle = '#20252b'; o.fillRect(0, 0, 1920, 1080);
    o.drawImage(onionskin(), 0, 0); o.globalCompositeOperation = 'multiply';
    for (const k of ['form', 'typing', 'stamp']) o.drawImage(L[k], 0, 0);
    o.globalCompositeOperation = 'source-over'; return;
  }
  for (const k of (LAYER === 'all' ? ['form', 'typing', 'stamp'] : [LAYER])) o.drawImage(L[k], 0, 0);
};
</script></body></html>
