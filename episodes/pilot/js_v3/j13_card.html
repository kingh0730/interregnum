<!doctype html>
<!--
  J13 v3 · shot 45 · EPIGRAPH / TITLE: a letterpress card in the first light (non-diegetic). 9.0 s, FULL FRAME, opaque.
  Dark grey stock #26262A with paper fibre, seen straight down. Its only light is a raking band of dawn rose #F4C6C0
  from the left: a crisp, slightly irregular leading edge (light as a cut shape) and a slower falloff behind it.
  Under the band the card lifts toward #4A3C3E and the ink catches the light; away from it the words sink into the card.
  Printing: cream ink #E8DDC4, 0.6 px ink squash with a denser rim, a bite (1 px shadow on the edge away from the
  light, 1 px highlight on the edge toward it, only under the band), density 85–100 % per glyph, one lighter patch
  across two words ("cannot be").
  Type: Iowan Old Style (installed; the spec's old-style face), treated as metal type.
    0.3–2.8 the band's leading edge crosses the epigraph (≈ a word every 0.25 s); 2.8 the attribution is in the light;
    4.3–4.8 the band passes off the right edge and both sink into the dark.
    5.0 AI SI - I, lit at once by a wide band; 5.1–5.8 the rose light settles 70 % → 100 %.
    5.6 EPISODE ONE · CONTINUITY fades in over 0.4 s (cream at 60 %). 8.4–9.0 the light goes out; fade to black.
  Render: node tools/web/render.mjs episodes/pilot/js_v3/j13_card.html work/pilot/js_v3/j13_card.mp4 9 24
-->
<html><head><meta charset="utf-8"><title>J13 card</title></head><body>
<script src="kit.js"></script>
<script>
const W = 1920, H = 1080;
const cv = K.stage('#000'), c = cv.getContext('2d');
let READY;
// ── ink layers: alpha masks (Float32) for each printed group ──
function inkLayer(lines, seed, patch) {
  const lc = K.canvas(W, H), x = lc.getContext('2d'), rnd = K.rng(seed);
  for (const L of lines) {
    x.font = L.font; x.letterSpacing = L.track || '0px'; x.fontVariantCaps = L.caps || 'normal';
    x.textBaseline = 'alphabetic';
    const total = x.measureText(L.text).width; let px = W / 2 - total / 2;
    // per glyph: density 85–100 %, ink squash (a thin stroke = the spread rim, denser than the fill)
    for (let i = 0; i < L.text.length; i++) {
      const ch = L.text[i], adv = x.measureText(L.text.slice(0, i + 1)).width - x.measureText(L.text.slice(0, i)).width;
      const dens = .85 + rnd() * .15;
      x.fillStyle = `rgba(255,255,255,${dens * .9})`; x.fillText(ch, px, L.y);
      x.strokeStyle = `rgba(255,255,255,${Math.min(1, dens * 1.05)})`; x.lineWidth = 1.2; x.lineJoin = 'round'; x.strokeText(ch, px, L.y);
      px += adv;
    }
  }
  // uneven inking: a lighter patch across two words, and the grain of the paper breaking the ink
  if (patch) {
    x.globalCompositeOperation = 'destination-out';
    const g = x.createRadialGradient(patch[0], patch[1], 0, patch[0], patch[1], patch[2]);
    g.addColorStop(0, 'rgba(0,0,0,.32)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.save(); x.translate(patch[0], patch[1]); x.scale(1, .35); x.translate(-patch[0], -patch[1]);
    x.fillStyle = g; x.fillRect(patch[0] - patch[2], patch[1] - patch[2], patch[2] * 2, patch[2] * 2); x.restore();
  }
  x.globalCompositeOperation = 'destination-out'; x.globalAlpha = .22;
  x.drawImage(GRAIN, 0, 0, W, H); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  const d = x.getImageData(0, 0, W, H).data, a = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) a[i] = d[i * 4 + 3] / 255;
  // bite: edges of the impression. hi = edge toward the light (left), sh = edge away (right)
  const hi = new Float32Array(W * H), sh = new Float32Array(W * H);
  for (let y = 1; y < H - 1; y++) for (let xx = 1; xx < W - 1; xx++) {
    const i = y * W + xx, dx = a[i + 1] - a[i - 1];
    if (dx > .25) hi[i] = Math.min(1, dx); else if (dx < -.25) sh[i] = Math.min(1, -dx);
  }
  return { a, hi, sh };
}
let GRAIN, FIB, EPI, TITLE, SUB, EDGE;
READY = (async () => {
  await document.fonts.load('italic 54px "Iowan Old Style"'); await document.fonts.load('28px "Iowan Old Style"'); await document.fonts.load('110px "Iowan Old Style"');
  GRAIN = K.noiseCanvas(W, H, 404, { octaves: [[1, 1], [2, .5]] });
  // paper fibre: long thin fibres over a mottled stock
  const f = K.canvas(W, H), fx = f.getContext('2d'); fx.drawImage(K.noiseCanvas(W / 4, H / 4, 12, { octaves: [[3, 1], [14, .8], [60, .6]] }), 0, 0, W, H);
  const r = K.rng(8);
  for (let i = 0; i < 2600; i++) {
    let x = r() * W, y = r() * H, a = r() * 7; fx.strokeStyle = r() < .5 ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.10)'; fx.lineWidth = .6 + r() * .6;
    fx.beginPath(); fx.moveTo(x, y); for (let k = 0; k < 10; k++) { a += (r() - .5) * .5; x += Math.cos(a) * 4; y += Math.sin(a) * 4; fx.lineTo(x, y); } fx.stroke();
  }
  const fd = fx.getImageData(0, 0, W, H).data, g2 = GRAIN.getContext('2d').getImageData(0, 0, W, H).data;
  FIB = new Float32Array(W * H); for (let i = 0; i < W * H; i++) FIB[i] = .82 + .3 * (fd[i * 4] / 255) + .08 * (g2[i * 4] / 255 - .5);
  EPI = inkLayer([
    { text: 'The old is dying and the new cannot be born.', font: 'italic 54px "Iowan Old Style"', y: 500 },
    { text: '— Antonio Gramsci', font: '28px "Iowan Old Style"', caps: 'small-caps', y: 580 },
  ], 3, [1130, 486, 190]);
  TITLE = inkLayer([{ text: 'AI SI - I', font: '110px "Iowan Old Style"', track: '33px', y: 520 }], 5, null);
  SUB = inkLayer([{ text: 'EPISODE ONE · CONTINUITY', font: '28px "Iowan Old Style"', caps: 'small-caps', track: '7px', y: 640 }], 7, null);
  // the irregular cut edge of the light, per row (static: it is the shape of the window the light comes through)
  EDGE = new Float32Array(H); for (let y = 0; y < H; y++) EDGE[y] = K.fbm1(y / 38, 3) * 7 + K.noise1(y / 6, 9) * 1.5;
})();
window.ready = READY;
// the leading edge's x over time
const KEYS = [[0, -300], [.3, 470], [2.8, 1450], [4.3, 2150], [4.8, 3200]];
function lead(t) {
  for (let i = 1; i < KEYS.length; i++) if (t <= KEYS[i][0]) { const [t0, x0] = KEYS[i - 1], [t1, x1] = KEYS[i]; return x0 + (x1 - x0) * (t - t0) / (t1 - t0); }
  return 4000;
}
const img = c.createImageData(W, H), D = img.data;
const CARD = K.hex('#26262A').map(v => v / 255), LIFT = K.hex('#4A3C3E').map(v => v / 255), ROSE = K.hex('#F4C6C0').map(v => v / 255), INK = K.hex('#E8DDC4').map(v => v / 255);
window.renderFrame = async t => {
  await READY;
  const title = t >= 5.0;
  const layers = title ? [[TITLE, 1], [SUB, .6 * K.clamp((t - 5.6) / .4)]] : [[EPI, 1]];
  const strength = title ? (t < 5.1 ? .7 : .7 + .3 * K.ease.inOutSine(K.clamp((t - 5.1) / .7))) : 1;
  const master = 1 - K.clamp((t - 8.4) / .6);
  const lightOut = master;
  const X = lead(t), FALL = 1300;
  for (let y = 0; y < H; y++) {
    const e = EDGE[y];
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      let L;
      if (title) { // a wide still band over the title: cut edges at both sides
        const l = 170 + e, r = 1750 - e * .8;
        L = x < l || x > r ? 0 : Math.min(1, (x - l) / 12, (r - x) / 12) * (1 - .18 * Math.abs((x - 960) / 790) ** 2);
      } else {
        const d = X + e - x; // distance behind the leading edge
        L = d < 0 ? 0 : Math.min(1, d / 3) * Math.exp(-d / FALL);
      }
      L *= strength * lightOut;
      const fib = FIB[i];
      let r = (CARD[0] * (1 - L) + LIFT[0] * L) * fib, g = (CARD[1] * (1 - L) + LIFT[1] * L) * fib, b = (CARD[2] * (1 - L) + LIFT[2] * L) * fib;
      r += ROSE[0] * L * .06; g += ROSE[1] * L * .04; b += ROSE[2] * L * .04;
      for (const [Ly, op] of layers) {
        const a = Ly.a[i] * op; if (a <= 0 && !Ly.sh[i] && !Ly.hi[i]) continue;
        // the ink: nearly invisible in the dark, cream with rose where the light is
        const k = .2 + .8 * L;
        const ir = INK[0] * k * (1 - .25 * L) + ROSE[0] * L * .3, ig = INK[1] * k * (1 - .25 * L) + ROSE[1] * L * .22, ib = INK[2] * k * (1 - .25 * L) + ROSE[2] * L * .22;
        r = r * (1 - a) + ir * a; g = g * (1 - a) + ig * a; b = b * (1 - a) + ib * a;
        // the bite: only where the band rakes across it
        const s = Ly.sh[i] * L * .55 * op, h = Ly.hi[i] * L * .4 * op;
        r = r * (1 - s) + h * ROSE[0]; g = g * (1 - s) + h * ROSE[1]; b = b * (1 - s) + h * ROSE[2];
      }
      const p = i * 4;
      D[p] = Math.min(255, r * 255 * master); D[p + 1] = Math.min(255, g * 255 * master); D[p + 2] = Math.min(255, b * 255 * master); D[p + 3] = 255;
    }
  }
  c.putImageData(img, 0, 0);
};
</script></body></html>
