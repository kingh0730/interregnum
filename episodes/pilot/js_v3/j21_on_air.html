<!doctype html>
<!--
  J21 · shot 35 · ON AIR, cast into the lamp's red glass (production_design.md §4, §5 cast finish). 2.0 s.
  Glass-face TEXTURE (opaque) for comp's 4-corner homography onto k21's glass: the glass face is the rect
  x 60–1860, y 320–760 (1800 × 440, the plate's ≈4.1:1 glass); outside it is black.
  Letters: State Capitals skeleton, module = glass height / 10 = 44 px (cap height 264), word space 3, centred.
  Relief: a height map with a 45° bevel of 0.4 module (flat letter face 0.2 module wide on the 1-module stroke).
  ?layer=height renders the height map itself (white = raised face, 0 = glass), the still for comp's masks.
  Timeline: lit 0.0–0.4 (tungsten behind cast glass: an uneven hot spot; letter faces +25 % and toward #F0643A,
  bevel rims brighter). 0.4: off — the glass falls to its unlit 12 % over 3 frames, while an orange filament
  afterglow decays over 0.3 s. Unlit: the letters read as a darker embossing; lower bevels catch a thin pale cyan edge
  from the cold light below, upper bevels go dark.
  Render: node tools/web/render.mjs episodes/pilot/js_v3/j21_on_air.html work/pilot/js_v3/j21_on_air.mp4 2 24
-->
<html><head><meta charset="utf-8"><title>J21 ON AIR</title></head><body>
<script src="kit.js"></script>
<script>
const LAYER = K.param('layer', 'face');
const cv = K.stage('#000'), c = cv.getContext('2d');
const GX = 60, GY = 320, GW = 1800, GH = 440, M = GH / 10;
const W = 1920, H = 1080;
// ── height map: the monoline stroke inset in steps (a narrower stroke = the bevel climbing) ──
const hm = K.canvas(W, H), hc = hm.getContext('2d');
hc.fillStyle = '#000'; hc.fillRect(0, 0, W, H);
const tw = K.capsLayout('ON AIR').width * M, tx = GX + GW / 2 - tw / 2, ty = GY + GH / 2 - 3 * M;
const N = 24;
for (let k = 0; k <= N; k++) {
  const d = .4 * k / N;                    // inset in modules
  const v = Math.round(255 * k / N);
  // a stroke inset by d on each side: weight 1 − 2d; square caps shrink with it, so the ends inset by d too
  K.capsFill(hc, 'ON AIR', tx, ty, M, { color: `rgb(${v},${v},${v})`, weight: 1 - 2 * d });
}
const HD = hc.getImageData(0, 0, W, H).data;
const height = new Float32Array(W * H); for (let i = 0; i < W * H; i++) height[i] = HD[i * 4] / 255;
// normals: the bevel's slope direction (y down); letters' faces are flat
const nx = new Float32Array(W * H), ny = new Float32Array(W * H);
for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
  const i = y * W + x; nx[i] = (height[i + 1] - height[i - 1]); ny[i] = (height[i + W] - height[i - W]);
}
// ── cast glass: mottled, with swirls of thickness (static) ──
const noise = K.noiseCanvas(W, H, 35, { octaves: [[3, .5], [11, 1], [40, .9], [120, .6]] });
const ND = noise.getContext('2d').getImageData(0, 0, W, H).data;
function inGlass(x, y) { return x >= GX && x < GX + GW && y >= GY && y < GY + GH; }
// precompute lit and unlit images and the filament glow image (float RGB)
const LIT = new Float32Array(W * H * 3), UNLIT = new Float32Array(W * H * 3), GLOW = new Float32Array(W * H * 3);
(function build() {
  const red = [224, 65, 47], hot = [240, 100, 58];
  for (let y = GY; y < GY + GH; y++) for (let x = GX; x < GX + GW; x++) {
    const i = y * W + x, n = ND[i * 4] / 255, h = height[i];
    const u = (x - GX) / GW - .5, v = (y - GY) / GH - .5;
    // tungsten behind: an uneven hot spot a little left of centre plus the bulb's second bloom right
    const spot = .72 + .38 * Math.exp(-((u + .08) ** 2 * 5 + (v - .05) ** 2 * 9)) + .12 * Math.exp(-((u - .3) ** 2 * 14 + v * v * 10)) - .25 * (Math.abs(u) ** 3 * 6);
    const cast = .78 + .44 * n;                               // glass thickness
    const face = h >= .999 ? 1 : 0, bevel = h > 0 && h < .999 ? 1 : 0;
    // edge glow at the glass rim (the metal frame shades the edge)
    const rim = K.smooth(0, 18, Math.min(x - GX, GX + GW - x, y - GY, GY + GH - y));
    const bl = bevel ? .18 + .22 * (1 - Math.abs(h - .5) * 2) : 0; // the rim brightest mid-bevel, where it refracts most
    let L = spot * cast * (1 + .25 * face + bl) * (.55 + .45 * rim);
    const col = face || bevel ? hot : red;
    for (let k = 0; k < 3; k++) LIT[i * 3 + k] = col[k] / 255 * L;
    // unlit: glass at 12 % (#3A1512), relief shaded by the cold light from below
    const g = [58, 21, 18].map(v => v / 255 * (.8 + .4 * n));
    let r = g[0], gg = g[1], b = g[2];
    if (bevel) {
      const sl = ny[i], len = Math.hypot(nx[i], ny[i]) || 1;
      const down = -ny[i] / len; // bevel facing down (height rising upward) catches the light from below
      if (down > .3 && h < .45) { const k = (down - .3) * (1 - h / .45); r += .16 * k; gg += .36 * k; b += .38 * k; }
      else if (down < -.2) { r *= .55; gg *= .5; b *= .5; }
    } else if (face) { r *= .78; gg *= .72; b *= .72; }
    UNLIT[i * 3] = r * rim; UNLIT[i * 3 + 1] = gg * rim; UNLIT[i * 3 + 2] = b * rim;
    // afterglow: the cooling filament seen through the glass, orange, concentrated where the bulb sits
    const fg = Math.exp(-((u + .08) ** 2 * 7 + (v - .05) ** 2 * 12)) * cast;
    GLOW[i * 3] = 1.0 * fg; GLOW[i * 3 + 1] = .42 * fg; GLOW[i * 3 + 2] = .08 * fg;
  }
})();
const img = c.createImageData(W, H), D = img.data;
window.renderFrame = t => {
  if (LAYER === 'height') { c.drawImage(hm, 0, 0); return; }
  const F = 1 / 24, off = .4;
  const lit = t < off ? 1 : K.clamp(1 - (t - off) / (3 * F));
  const glow = t < off ? 0 : .55 * Math.exp(-(t - off) / .1) * (t - off < .3 ? 1 : 0);
  for (let i = 0, p = 0; i < W * H; i++, p += 4) {
    const j = i * 3;
    let r = UNLIT[j] * (1 - lit) + LIT[j] * lit + GLOW[j] * glow;
    let g = UNLIT[j + 1] * (1 - lit) + LIT[j + 1] * lit + GLOW[j + 1] * glow;
    let b = UNLIT[j + 2] * (1 - lit) + LIT[j + 2] * lit + GLOW[j + 2] * glow;
    D[p] = Math.min(255, r * 255); D[p + 1] = Math.min(255, g * 255); D[p + 2] = Math.min(255, b * 255); D[p + 3] = 255;
  }
  c.putImageData(img, 0, 0);
};
</script></body></html>
