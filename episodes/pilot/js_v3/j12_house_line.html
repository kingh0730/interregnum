<!doctype html>
<!--
  J12 v3 · shot 37 · the House Line: the pencilled name card and the amber call lamp. 3.0 s, an ATLAS (opaque .mp4).
  Regions (x, y, w, h in the 1920×1080 frame; also window.REGIONS):
    card  [80, 120, 1040, 280]  MULTIPLY texture: white = no mark. NANA in Ida's pencil (small careful capitals leaning
                                forward, graphite grain) plus the celluloid's static scratch layer at 10 %. Static.
    lamp  [1300, 90, 420, 420]  the amber call-lamp jewel lens (a filament behind a fluted jewel), on black; composite
                                with screen/add onto the plate's lens. Lit 0.1–0.6 s and 1.6–2.1 s, 60 ms rise, 150 ms fall.
  The lamp level per frame (0–1) is written to work/pilot/js_v3/j12_lamp.json for comp's hard-edged warm spill on the
  enamel and card (near planes toward amber ink by up to 35 %) and the handset's 0.5 px rattle on each ring.
  Render: node tools/web/render.mjs episodes/pilot/js_v3/j12_house_line.html work/pilot/js_v3/j12_house_line.mp4 3 24
-->
<html><head><meta charset="utf-8"><title>J12 House Line</title></head><body>
<script src="kit.js"></script>
<script>
const out = K.stage('#000'), o = out.getContext('2d');
const REGIONS = window.REGIONS = { card: [80, 120, 1040, 280], lamp: [1300, 90, 420, 420] };
const RINGS = [[.1, .6], [1.6, 2.1]];
window.lampLevel = t => K.filament(t, RINGS, .06, .15);

function makeCard() {
  const [x, y, w, h] = REGIONS.card, cv = K.canvas(1920, 1080), c = cv.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(x, y, w, h);
  // the pencil: NANA, small careful capitals, leaning forward, pressed a little harder on the downstrokes
  // graphite is laid down in several light passes of a fine point, then the paper's tooth breaks it up
  const pen = K.canvas(1920, 1080), pc = pen.getContext('2d');
  [[0, 0, .75], [.9, .4, .45], [-.5, .7, .35]].forEach(([dx, dy, a], i) => {
    pc.globalAlpha = a; K.hand(pc, 'NANA', x + w / 2 + dx, y + h / 2 - 50 + dy, 100, 'pencil', { align: 'center', seed: 12, w: .045, grain: 0, col: [48, 48, 56] });
  });
  pc.globalAlpha = 1;
  const tooth = K.canvas(256, 256), tc = tooth.getContext('2d'), td = tc.createImageData(256, 256), r2 = K.rng(9);
  for (let i = 0; i < td.data.length; i += 4) { const v = r2(); td.data[i + 3] = v < .42 ? 0 : Math.round((v - .42) * 330); }
  tc.putImageData(td, 0, 0);
  pc.globalCompositeOperation = 'destination-out'; pc.fillStyle = pc.createPattern(tooth, 'repeat'); pc.fillRect(0, 0, 1920, 1080);
  c.drawImage(pen, 0, 0);
  // a faint rubbed-out ruling line she wrote on
  c.strokeStyle = 'rgba(120,120,128,.12)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x + 150, y + h / 2 + 72); c.lineTo(x + w - 150, y + h / 2 + 70); c.stroke();
  // celluloid over it: fine scratches and a scuff, at 10 %
  const rnd = K.rng(37); c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); c.globalAlpha = .1; c.strokeStyle = '#4a4a4a';
  for (let i = 0; i < 70; i++) {
    const sx = x + rnd() * w, sy = y + rnd() * h, a = -.3 + rnd() * .6 + (rnd() < .3 ? 1.4 : 0), L = 20 + rnd() * 160;
    c.lineWidth = .5 + rnd() * .9; c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx + Math.cos(a) * L, sy + Math.sin(a) * L); c.stroke();
  }
  c.globalAlpha = .06; c.fillStyle = '#555'; c.beginPath(); c.ellipse(x + w * .78, y + h * .7, 120, 40, -.2, 0, 7); c.fill();
  c.restore();
  // edge of the celluloid window: a slightly darker frame where the cover's lip presses the card
  c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 6; c.strokeRect(x + 3, y + 3, w - 6, h - 6);
  return cv;
}
function drawLamp(c, lv) {
  const [x, y, w, h] = REGIONS.lamp, cx = x + w / 2, cy = y + h / 2, R = 150;
  c.save(); c.fillStyle = '#000'; c.fillRect(x, y, w, h);
  // chrome-less bakelite bezel ring
  c.fillStyle = '#17120e'; c.beginPath(); c.arc(cx, cy, R + 26, 0, 7); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, R + 22, Math.PI * 1.1, Math.PI * 1.6); c.stroke();
  c.beginPath(); c.arc(cx, cy, R, 0, 7); c.clip();
  // the jewel body: amber glass, dark when cold
  const body = c.createRadialGradient(cx, cy, 0, cx, cy, R);
  body.addColorStop(0, K.mix('#4a2c0c', '#FFD9A0', lv)); body.addColorStop(.45, K.mix('#3a220a', '#F2A441', lv));
  body.addColorStop(1, K.mix('#1c1005', '#9a5a18', lv));
  c.fillStyle = body; c.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  // fluting: vertical ridges, each with a lit edge and a dark edge (they refract the filament into bars)
  const n = 13;
  for (let i = 0; i < n; i++) {
    const x0 = cx - R + i * 2 * R / n, fw = 2 * R / n;
    const g = c.createLinearGradient(x0, 0, x0 + fw, 0);
    const k = 1 - Math.abs((i + .5) / n - .5) * 2;
    g.addColorStop(0, `rgba(0,0,0,${.35 - .15 * lv})`); g.addColorStop(.35, `rgba(255,${200 + 40 * lv},${120 + 80 * lv},${.06 + .45 * lv * k})`);
    g.addColorStop(.6, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${.4 - .2 * lv})`);
    c.fillStyle = g; c.fillRect(x0, cy - R, fw, 2 * R);
  }
  // the filament's hot core, smeared vertically by the flutes
  if (lv > 0) {
    c.globalCompositeOperation = 'lighter';
    const core = c.createRadialGradient(cx, cy, 0, cx, cy, R * .55);
    core.addColorStop(0, `rgba(255,217,160,${.95 * lv})`); core.addColorStop(.5, `rgba(242,164,65,${.45 * lv})`); core.addColorStop(1, 'rgba(242,164,65,0)');
    c.save(); c.translate(cx, cy); c.scale(.55, 1.25); c.translate(-cx, -cy); c.fillStyle = core; c.fillRect(cx - R * 2, cy - R, R * 4, R * 2); c.restore();
    c.globalCompositeOperation = 'source-over';
  }
  // cold-glass specular from the room, upper left (always there)
  c.fillStyle = 'rgba(210,235,235,.10)'; c.beginPath(); c.ellipse(cx - R * .45, cy - R * .5, R * .28, R * .12, -.6, 0, 7); c.fill();
  c.restore();
  // bloom on the lens only: a thin warm ring just inside the bezel
  if (lv > 0) {
    c.save(); c.globalCompositeOperation = 'lighter';
    const b = c.createRadialGradient(cx, cy, R * .7, cx, cy, R + 14);
    b.addColorStop(0, 'rgba(242,164,65,0)'); b.addColorStop(.8, `rgba(242,164,65,${.25 * lv})`); b.addColorStop(1, 'rgba(242,164,65,0)');
    c.fillStyle = b; c.beginPath(); c.arc(cx, cy, R + 14, 0, 7); c.fill(); c.restore();
  }
}
let CARD = null;
window.renderFrame = t => {
  if (!CARD) CARD = makeCard();
  o.fillStyle = '#000'; o.fillRect(0, 0, 1920, 1080); o.drawImage(CARD, 0, 0);
  drawLamp(o, lampLevel(t));
};
</script></body></html>
