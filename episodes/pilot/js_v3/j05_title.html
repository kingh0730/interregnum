<!doctype html>
<!--
  J05 v3 · shot 09 · CONTINUITY written by a stroke beam (non-diegetic). 4.0 s, full frame, opaque.
  State Capitals, phosphor finish: the centre-line skeleton, module 26 px (cap height 156), stroke 5 px, centred on y 540.
  0.3–2.0 s: about 4 frames a letter, drawn in stroke order with the beam's head, beads at vertices and stroke ends,
  overshoot hooks at sharp corners. Each stroke blazes and decays over ~1.5 s to a 12 % afterglow that holds to the cut.
  Render: node tools/web/render.mjs episodes/pilot/js_v3/j05_title.html work/pilot/js_v3/j05_title.mp4 4 24
-->
<html><head><meta charset="utf-8"><title>J05 CONTINUITY</title></head><body>
<script src="kit.js"></script>
<script>
const out = K.stage('#000');
const W = 1920, H = 1080, M = 26, WORD = 'CONTINUITY';
const src = K.canvas(W, H), c = src.getContext('2d');
const crt = new K.CRT({ rect: [-160, -120, W + 320, H + 240], k1: .02, vig: .18, scanN: 0, bloom: 1.35, halo: .3,
  exposure: 1.25, hot: .9, glare: 0, glass: [0, 0, 0], dustAmt: .35, dustSeed: 9, outside: 'black' });
const ox = W / 2 - K.capsLayout(WORD).width * M / 2, oy = 540 - 3 * M;
// one beam schedule per letter: ~4 frames a letter across 0.3–2.0 s
const sched = [];
const L = K.capsLayout(WORD, 10);
L.glyphs.forEach((g, i) => {
  const ta = .3 + i * 1.7 / L.glyphs.length, tb = ta + 1.7 / L.glyphs.length - 1 / 48;
  const strokes = g.g.strokes.map(s => s.map(([u, v]) => [ox + (g.x + u) * M, oy + v * M]));
  sched.push(...K.beamSchedule(strokes, ta, tb, { blank: .25, ref: 80 }));
});
const level = age => age < 0 ? 0 : .12 + .88 * Math.exp(-age / .42);
window.renderFrame = t => {
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  // the phosphor: bloom colour at the decayed level
  K.beamDraw(c, sched, t, { color: K.C.cold, width: 5, hook: 2.5, bead: 3.6, level, ref: 80, head: K.C.coldCore, beadAlpha: .8 });
  // the blaze: a white-hot core on freshly written strokes
  K.beamDraw(c, sched, t, { color: K.C.coldCore, width: 2.6, hook: 2.5, bead: 2.4, beads: false, ref: 80,
    level: age => age < 0 ? 0 : Math.exp(-age / .12), head: '#ffffff' });
  const fl = .012 * K.noise1(t * 30, 4);
  crt.render(src, { flicker: fl });
  const o = out.getContext('2d'); o.clearRect(0, 0, W, H); o.drawImage(crt.canvas, 0, 0);
};
</script></body></html>
