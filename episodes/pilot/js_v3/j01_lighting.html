<!doctype html>
<!--
  J01 v3 · THE LIGHTING: a Year One 35 mm black-and-white film run through the telecine every night for 41 years.
  Full frame, opaque: the 4:3 picture (1440×1080) centred in the 1920×1080 master, black pillarbox. No bug.
  Picture: plate p01 as the v1 fallback (the unlit state is derived by masking the flame; the spotlight finds the
  ring; the flame grows from its base). Caption card THE EVENING ADDRESS · 21:00 hand-painted in State Capitals,
  superimposed optically. Film wear (grain, fixed scratches, dust, gate weave, flicker, splice) and the telecine
  chain (interlace twitter, soft video bloom, tint).
  Variants (?v=):
    main  shot 01, 5.0 s: leader 0–0.2, splice bump 0.2, spotlight 0.5, catch 1.0, flame stands 1.5, caption 2.2–3.0
    fast  shot 28, 3.0 s: black 0–0.3, splice flash 0.3, catch 0.6, stands 0.9, caption 1.0–1.5, deeper cold tint
    alt   shot 46 1.0–4.0 (3.0 s, film time 0.2–3.2): spotlight 0.3, catch 0.8, stands 1.3, caption 2.0–2.8, old warmth
  Caption module: the spec asks for module 13, but at 13 px the line is 1473 px wide, wider than the 1440 px
  picture. It is set at module 10.5 (cap height 63) so it fits with a margin; still centred on y 820.
  Render: node tools/web/render.mjs episodes/pilot/js_v3/j01_lighting.html[?v=fast] work/pilot/js_v3/j01_lighting[_fast].mp4 5 24
-->
<html><head><meta charset="utf-8"><title>J01 The Lighting</title></head><body>
<script src="kit.js"></script>
<script>
const V = K.param('v', 'main');
const out = K.stage('#000'), octx = out.getContext('2d');
const PW = 1440, PH = 1080, PX = 240, F = 1 / 24;
const EV = {
  main: { leader: .2, bump: .2, flash: null, spot: .5, catch: 1.0, stand: 1.5, cap: [2.2, 3.0], hi: K.hex('#E0EDE6'), crush: 0, scr: 101 },
  fast: { leader: .3, bump: null, flash: .3, spot: -1, catch: .6, stand: .9, cap: [1.0, 1.5], hi: K.hex('#CDE8EE'), crush: .05, scr: 202 },
  alt:  { leader: 0, bump: null, flash: null, spot: .3, catch: .8, stand: 1.3, cap: [2.0, 2.8], hi: K.hex('#EADFC6'), crush: 0, scr: 101 },
}[V];
const BLACK = K.hex('#11151F');

// ── picture: p01 as luminance, flame mask, unlit state
let lum, unlit, flameLum, flameMask;
const WICK = [713, 539];          // the wick, in picture space (from the plate)
const FBOX = [640, 215, 790, 538]; // the flame's box, above the cup
const pic = K.canvas(PW, PH), pc = pic.getContext('2d');
const work = K.canvas(PW, PH), wc = work.getContext('2d', { willReadFrequently: true });
const cap = K.canvas(PW, PH), cc = cap.getContext('2d');
const bloomC = K.canvas(PW, PH), bc = bloomC.getContext('2d');
let grain;

window.ready = (async () => {
  const im = await K.asset('p01');
  const t = K.canvas(PW, PH), tc = t.getContext('2d'); tc.drawImage(im, 0, 0, PW, PH);
  const d = tc.getImageData(0, 0, PW, PH).data;
  lum = new Float32Array(PW * PH); flameMask = new Float32Array(PW * PH);
  for (let i = 0; i < PW * PH; i++) lum[i] = (d[i * 4] * .3 + d[i * 4 + 1] * .55 + d[i * 4 + 2] * .15) / 255;
  // normalise the print: plate black → 0, cream → 1
  for (let i = 0; i < lum.length; i++) lum[i] = K.clamp((lum[i] - .06) / .8);
  for (let y = FBOX[1]; y < FBOX[3]; y++) for (let x = FBOX[0]; x < FBOX[2]; x++) {
    const v = lum[y * PW + x]; flameMask[y * PW + x] = K.smooth(.18, .4, v);
  }
  // grow the mask by 2 px so the flame's carved edge goes with it
  const m2 = flameMask.slice();
  for (let y = FBOX[1]; y < FBOX[3]; y++) for (let x = FBOX[0]; x < FBOX[2]; x++) {
    let mx = 0; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) mx = Math.max(mx, flameMask[(y + dy) * PW + x + dx]);
    m2[y * PW + x] = mx;
  }
  flameMask = m2;
  unlit = new Float32Array(lum.length); flameLum = new Float32Array(lum.length);
  const rnd = K.rng(3);
  for (let i = 0; i < lum.length; i++) {
    const k = flameMask[i]; unlit[i] = lum[i] * (1 - k) + k * .02 * rnd(); flameLum[i] = lum[i] * k;
  }
  grain = K.noiseCanvas(720, 540, 17, { octaves: [[1, 1], [1.7, .5]] });
  buildCaption();
})();

// ── the caption card: hand-painted State Capitals, dry brush
function buildCaption() {
  const M = 10.5, TEXT = 'THE EVENING ADDRESS · 21:00';
  cc.clearRect(0, 0, PW, PH);
  cc.save(); cc.translate(PW / 2, 820); cc.rotate(-.5 * Math.PI / 180); cc.translate(-PW / 2, -820);
  const S = K.capsStrokes(TEXT, PW / 2, 820 - 3 * M, M, { align: 'center', facets: 8 });
  const rnd = K.rng(41);
  // group strokes by letter to place 2–3 brush breaks per letter
  let li = -1, lastCh = null, breaks = [];
  S.strokes.forEach((s, si) => {
    const zero = s.pts.every(p => Math.hypot(p[0] - s.pts[0][0], p[1] - s.pts[0][1]) < .5);
    if (zero) { // a dot (the middle dot, the colon): a painted square dab
      const [x, y] = s.pts[0];
      for (let k = 0; k < 6; k++) { cc.fillStyle = `rgba(255,255,255,${.35 + rnd() * .3})`; cc.fillRect(x - M / 2 + (rnd() - .5) * 1.6, y - M / 2 + (rnd() - .5) * 1.6, M + (rnd() - .5) * 1.5, M + (rnd() - .5) * 1.5); }
      return;
    }
    // resample the stroke every 1 px
    const P = [s.pts[0]];
    for (let i = 1; i < s.pts.length; i++) {
      const [ax, ay] = s.pts[i - 1], [bx, by] = s.pts[i], n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay)));
      for (let k = 1; k <= n; k++) P.push([ax + (bx - ax) * k / n, ay + (by - ay) * k / n]);
    }
    // extend the ends by half a module (square-ended flat brush)
    const ext = (a, b) => { const l = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1; return [a[0] + (a[0] - b[0]) / l * M * .45, a[1] + (a[1] - b[1]) / l * M * .45]; };
    if (P.length > 1) { P.unshift(ext(P[0], P[1])); P.push(ext(P[P.length - 1], P[P.length - 2])); }
    const nb = rnd() < .5 ? 1 : 2, br = []; for (let k = 0; k < nb; k++) br.push(.2 + rnd() * .6);
    const BR = 11, seed = si * 13;
    for (let b = 0; b < BR; b++) {
      const off = (b / (BR - 1) - .5) * M * .98, bw = M / BR * 1.9;
      cc.lineWidth = bw; cc.lineCap = 'round';
      const edge = b === 0 || b === BR - 1;
      for (let i = 1; i < P.length; i++) {
        const u = i / P.length;
        const [ax, ay] = P[i - 1], [bx, by] = P[i]; const l = Math.hypot(bx - ax, by - ay) || 1;
        const nx = -(by - ay) / l, ny = (bx - ax) / l;
        const wob = K.noise1(i * .15 + b * 3.1, seed) * (edge ? 2.2 : .6);
        let a = .8 + .2 * K.noise1(i * .05, seed + b);
        // paint runs dry toward the stroke's end: skips grow
        const dry = K.noise1(i * .35 + b * 7.7, seed + 99) + u * .7 - .55;
        if (dry > .35) a *= .15;
        for (const c of br) if (Math.abs(u - c) < .045 && (b % 4 !== 1)) a *= .05; // a brush break
        if (a < .06) continue;
        cc.strokeStyle = `rgba(255,255,255,${a})`;
        cc.beginPath(); cc.moveTo(ax + nx * (off + wob), ay + ny * (off + wob)); cc.lineTo(bx + nx * (off + wob), by + ny * (off + wob)); cc.stroke();
      }
    }
  });
  cc.restore();
}

// ── scratches on the print: fixed for the whole shot
function scratches(ctx, seed) {
  const r = K.rng(seed), n = 2 + (r() < .5 ? 1 : 0);
  for (let k = 0; k < n; k++) {
    const x = 120 + r() * (PW - 240), a = .3 + r() * .3, y0 = r() * 300, y1 = PH - r() * 200;
    for (let y = y0; y < y1; y += 6) {
      const aa = a * (.6 + .4 * K.noise1(y * .02, seed + k));
      ctx.fillStyle = `rgba(232,221,196,${aa})`; ctx.fillRect(x + K.noise1(y * .004, seed + k * 5) * 2, y, 1, 6);
    }
  }
}
function dust(ctx, f) {
  const r = K.rng(1000 + f), n = 3 + Math.floor(r() * 4);
  for (let k = 0; k < n; k++) {
    const x = r() * PW, y = r() * PH, white = r() < .45, s = .8 + Math.pow(r(), 2) * 4;
    ctx.fillStyle = white ? `rgba(240,235,220,${.5 + r() * .4})` : `rgba(0,0,0,${.6 + r() * .4})`;
    if (r() < .2) { // a hair
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1; ctx.beginPath(); let px = x, py = y, a = r() * 7; ctx.moveTo(px, py);
      for (let i = 0; i < 10; i++) { a += (r() - .5); px += Math.cos(a) * 4; py += Math.sin(a) * 4; ctx.lineTo(px, py); } ctx.stroke();
    } else { ctx.beginPath(); ctx.ellipse(x, y, s, s * (.5 + r() * .6), r() * 3, 0, 7); ctx.fill(); }
  }
}

window.renderFrame = t => {
  const f = Math.round(t * 24);
  const img = pc.createImageData(PW, PH), d = img.data;
  const lead = t < EV.leader;
  // the spotlight finds the ring: lit shapes 0 → 100 % in 4 frames
  const L = lead ? 0 : (EV.spot < 0 ? 1 : K.clamp((t - EV.spot) / (4 * F)));
  // the flame: grows from its base between catch and stand; a 2-frame flicker at the catch; then it lives
  let s = 0, fb = 1;
  if (t >= EV.catch) {
    const u = K.clamp((t - EV.catch) / (EV.stand - EV.catch));
    s = K.ease.outCubic(u) * .96 + .04;
    const fc = Math.floor((t - EV.catch) * 24 + 1e-6);
    if (fc === 0) { s = .22; fb = 1.3; } else if (fc === 1) { s = .12; fb = .55; }
    if (u >= 1) { s = 1 + .025 * K.fbm1(t * 6, 8); fb = 1 + .05 * K.fbm1(t * 9, 9); }
  }
  const sx = s ? 1 / (s * (.9 + .1 * s)) : 0, sy = s ? 1 / s : 0;
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const i = y * PW + x; let v = unlit[i] * L;
    if (s > 0 && x >= FBOX[0] - 20 && x < FBOX[2] + 20 && y >= FBOX[1] - 30 && y < FBOX[3]) {
      const qx = Math.round(WICK[0] + (x - WICK[0]) * sx), qy = Math.round(WICK[1] + (y - WICK[1]) * sy);
      if (qx >= FBOX[0] && qx < FBOX[2] && qy >= FBOX[1] && qy < FBOX[3]) v = Math.max(v, flameLum[qy * PW + qx] * fb);
    }
    const g = Math.round(K.clamp(v) * 255); d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = g; d[i * 4 + 3] = 255;
  }
  pc.putImageData(img, 0, 0);
  if (!lead) scratches(pc, EV.scr);
  dust(pc, f);
  // gate weave (and the splice bump: a 2-frame, 12 px jump with the frame line flashing into view)
  let wx = 1.5 * K.fbm1(t * 1.7, 21), wy = 1.5 * K.fbm1(t * 1.3, 22);
  let bump = 0; if (EV.bump != null && t >= EV.bump && t < EV.bump + 2 * F - 1e-6) bump = 12;
  wc.fillStyle = '#000'; wc.fillRect(0, 0, PW, PH);
  wc.drawImage(pic, wx, wy + bump);
  if (bump) { wc.fillStyle = '#000'; wc.fillRect(0, 0, PW, bump + wy); wc.fillStyle = 'rgba(235,235,225,.9)'; wc.fillRect(0, bump + wy - 5, PW, 4); wc.fillStyle = 'rgba(235,235,225,.25)'; wc.fillRect(0, 0, PW, bump + wy - 5); }
  if (EV.flash != null && t >= EV.flash && t < EV.flash + F - 1e-6) { // 1-frame splice flash at the join: a white frame line
    wc.fillStyle = 'rgba(245,245,238,.95)'; wc.fillRect(0, 318, PW, 7); wc.fillStyle = '#000'; wc.fillRect(0, 325, PW, 16);
  }
  // the caption: a second strip of film, superimposed additively with its own weave and a 1.5 px blur
  if (t >= EV.cap[0]) {
    const a = K.ease.inOutSine(K.clamp((t - EV.cap[0]) / (EV.cap[1] - EV.cap[0])));
    // a dark title band under the caption (a burned-in card), so the lamp's stand never reads through the letters
    const band = wc.createLinearGradient(0, 820 - 3 * 10.5 - 70, 0, 820 - 3 * 10.5 + 110);
    band.addColorStop(0, 'rgba(0,0,0,0)'); band.addColorStop(.3, `rgba(0,0,0,${.85 * a})`);
    band.addColorStop(.7, `rgba(0,0,0,${.85 * a})`); band.addColorStop(1, 'rgba(0,0,0,0)');
    wc.fillStyle = band; wc.fillRect(0, 820 - 3 * 10.5 - 70, PW, 180);
    wc.save(); wc.globalCompositeOperation = 'lighter'; wc.globalAlpha = a * .92; wc.filter = 'blur(1.5px)';
    wc.drawImage(cap, 1.2 * K.fbm1(t * 1.9, 31), 1.2 * K.fbm1(t * 1.5, 32)); wc.restore();
  }
  // grain, flicker, interlace twitter, film response → tint
  const G = wc.getImageData(0, 0, PW, PH), gd = G.data;
  const gimg = grain.getContext('2d').getImageData(0, 0, 720, 540).data;
  const gr = K.rng(500 + f), gox = Math.floor(gr() * 720), goy = Math.floor(gr() * 540);
  const flick = 1 + .04 * K.noise1(t * 24 * .9, 5);
  const par = f % 2, hi = EV.hi;
  const lumA = new Float32Array(PW * PH);
  for (let i = 0; i < PW * PH; i++) lumA[i] = gd[i * 4] / 255;
  for (let y = 0; y < PH; y++) {
    const yn = K.clamp(y + (par ? 1 : -1), 0, PH - 1);
    for (let x = 0; x < PW; x++) {
      const i = y * PW + x;
      let v = lumA[i] * .82 + lumA[yn * PW + x] * .18;               // the fields disagree on thin horizontals
      const gx = ((x >> 1) + gox) % 720, gy = ((y >> 1) + goy) % 540;
      const n = gimg[(gy * 720 + gx) * 4] / 255 - .5;
      v = v * flick + n * .06 * (.4 + v * (1 - v) * 2.4);
      v = K.clamp((v - EV.crush) / (1 - EV.crush));
      v = Math.pow(v, 1.08);                                          // the print's toe
      gd[i * 4] = BLACK[0] + (hi[0] - BLACK[0]) * v; gd[i * 4 + 1] = BLACK[1] + (hi[1] - BLACK[1]) * v; gd[i * 4 + 2] = BLACK[2] + (hi[2] - BLACK[2]) * v;
    }
  }
  wc.putImageData(G, 0, 0);
  // soft video bloom
  bc.clearRect(0, 0, PW, PH); bc.filter = 'blur(14px)'; bc.drawImage(work, 0, 0); bc.filter = 'none';
  octx.fillStyle = '#000'; octx.fillRect(0, 0, 1920, 1080);
  octx.filter = 'blur(.6px)'; octx.drawImage(work, PX, 0); octx.filter = 'none';
  octx.globalCompositeOperation = 'screen'; octx.globalAlpha = .28; octx.drawImage(bloomC, PX, 0);
  octx.globalAlpha = 1; octx.globalCompositeOperation = 'source-over';
  octx.fillStyle = '#000'; octx.fillRect(0, 0, PX, 1080); octx.fillRect(PX + PW, 0, PX, 1080);
};
</script></body></html>
