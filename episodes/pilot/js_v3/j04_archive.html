<html><head><meta charset="utf-8"><title>J04 Archive</title></head><body>
<script src="kit.js"></script>
<script>
const out = K.stage('#000'), o = out.getContext('2d');
const R = window.REGIONS = { strip: [0, 40, 1920, 276], captured: [80, 420, 700, 250], generated: [900, 420, 470, 250],
  scope: [1400, 340, 480, 480], vitalsPlate: [1455, 836, 370, 44], noSignal: [1470, 900, 340, 80], tag: [80, 720, 700, 320] };
const F = 1 / 24, PITCH = 150, SH = 276, NLIVE = 40 * 12 + 2, NGEN = 212, CAPT = 14763;

// ───── the transport: position = the frame index under the window's centre ─────
const V = NLIVE / 3.3;
function posCaptured(t) {
  if (t <= 0) return 0;
  if (t < 1) return V * t * t / 2;
  if (t < 3) return V * (.5 + (t - 1));
  if (t < 4.6) { const u = t - 3; return V * (2.5 + u - u * u / 3.2); }
  const u = (t - 4.6) / .12; return NLIVE + (u < 1 ? (2 / PITCH) * Math.sin(Math.PI * u) * (1 - u) * 1.6 : 0);
}
// generated run: exponential rise 3 → 150 fps over Ta, hold, brake over 0.25 s; solved so it covers exactly 212 frames
const GA = 1.95, GB = .25, GH = 3 - GA - GB, gk = Math.log(50) / GA;
function genDist(tau) {
  if (tau <= 0) return 0;
  if (tau < GA) return 3 * (Math.exp(gk * tau) - 1) / gk;
  const d1 = 3 * 49 / gk; if (tau < GA + GH) return d1 + 150 * (tau - GA);
  const d2 = d1 + 150 * GH, u = Math.min(tau - GA - GH, GB); return d2 + 150 * u - 150 * u * u / (2 * GB);
}
const GTOT = genDist(3);
function posStrip(t) {
  if (t < 5.2) return posCaptured(t);
  const tau = t - 5.2; let p = NLIVE + NGEN * genDist(Math.min(tau, 3)) / GTOT;
  if (tau > 3) { const u = (tau - 3) / .12; if (u < 1) p += (2 / PITCH) * Math.sin(Math.PI * u) * (1 - u) * 1.6; }
  return p;
}
const capturedCount = t => 1 + (CAPT - 1) * K.clamp(posCaptured(Math.min(t, 4.6)) / NLIVE);
const generatedCount = t => t < 5.2 ? 1 : 1 + (NGEN - 1) * K.clamp((posStrip(Math.min(t, 8.2)) - NLIVE) / NGEN);

// ───── pictures on the film ─────
let SRC = {};
function gray(img, sx, sy, sw, sh, w, h, gamma = 1, contrast = 1.2) {
  const cv = K.canvas(w, h), c = cv.getContext('2d'); c.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  const d = c.getImageData(0, 0, w, h), a = d.data;
  for (let i = 0; i < a.length; i += 4) {
    let l = (a[i] * .3 + a[i + 1] * .55 + a[i + 2] * .15) / 255; l = K.clamp((Math.pow(l, gamma) - .5) * contrast + .5);
    a[i] = a[i + 1] = a[i + 2] = Math.round(l * 255);
  }
  c.putImageData(d, 0, 0); return cv;
}
const IW = 126, IH = 174, IX = 12, IY = 51;
function buildVariants() {
  const heads = [[160, 5, 304, 420], [690, 5, 304, 420], [1210, 5, 304, 420]], cap = [], gen = [], rnd = K.rng(8);
  for (let i = 0; i < 24; i++) {
    const [x, y, w, h] = heads[i % 3], z = .9 + rnd() * .22, dx = (rnd() - .5) * 40, dy = (rnd() - .5) * 30;
    cap.push(gray(SRC.father, x + dx + w * (1 - z) / 2, y + dy + h * (1 - z) / 2, w * z, h * z, IW, IH, 1.1, 1.35));
  }
  for (let i = 0; i < 10; i++) {
    const useK02 = i % 2 === 0, z = .92 + rnd() * .12;
    const [x, y, w, h] = useK02 ? [433, 90, 560, 773] : [231, 20, 240, 331];
    const im = useK02 ? SRC.k02 : SRC.k01;
    gen.push(gray(im, x + w * (1 - z) / 2, y + h * (1 - z) / 2, w * z, h * z, IW, IH, 1, 1.05));
  }
  return { cap, gen };
}
let VAR = null; const tiles = new Map();
function sprockets(c, fill) {
  c.fillStyle = fill;
  for (let k = 0; k < 4; k++) for (const yc of [18, SH - 18]) { c.beginPath(); c.roundRect(18.75 + k * 37.5 - 11, yc - 8, 22, 16, 3.5); c.fill(); }
}
function tile(i) {
  if (tiles.has(i)) return tiles.get(i);
  const cv = K.canvas(PITCH, SH), c = cv.getContext('2d'), rnd = K.rng(1000 + i);
  const captured = i <= NLIVE, clear = i >= NLIVE + NGEN, head = i < 0;
  // film base: neutral print stock, the generated nights on a blue base, clear leader after tonight
  const base = clear ? [246, 243, 236] : captured ? [226, 224, 218] : [138, 178, 232];
  c.fillStyle = `rgb(${base})`; c.fillRect(0, 0, PITCH, SH);
  // edge fog: slow density drift along both rebates
  for (const [y0, y1] of [[0, 44], [SH - 44, SH]]) {
    const g = c.createLinearGradient(0, y0, 0, y1), f = .06 + .08 * (K.noise1(i * .21, 3) * .5 + .5);
    const edge = y0 === 0 ? 0 : 1; g.addColorStop(edge, `rgba(0,0,0,${f})`); g.addColorStop(1 - edge, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(0, y0, PITCH, y1 - y0);
  }
  if (head) { c.fillStyle = 'rgb(28,28,30)'; c.fillRect(0, 44, PITCH, SH - 88); }
  else if (!clear) {
    // the frame line (black on a print) and the picture
    c.fillStyle = captured ? 'rgb(24,24,24)' : 'rgb(14,22,48)'; c.fillRect(0, IY - 3, PITCH, IH + 6);
    const src = captured ? VAR.cap[(i * 7) % VAR.cap.length] : VAR.gen[(i * 3) % VAR.gen.length];
    const dens = 1 + (rnd() - .5) * .16;
    c.save(); c.beginPath(); c.roundRect(IX, IY, IW, IH, 5); c.clip();
    c.filter = captured ? `brightness(${dens})` : `brightness(${dens * .95}) blur(0.6px)`;
    c.drawImage(src, IX, IY); c.filter = 'none';
    if (captured) { // grain
      const gd = c.getImageData(IX, IY, IW, IH), a = gd.data;
      for (let k = 0; k < a.length; k += 4) { const n = (rnd() - .5) * 38; a[k] += n; a[k + 1] += n; a[k + 2] += n; }
      c.putImageData(gd, IX, IY);
      c.globalCompositeOperation = 'multiply'; c.fillStyle = 'rgb(236,232,222)'; c.fillRect(IX, IY, IW, IH);
    } else { // recorded from a tube: blue stock, scanlines inside the frame
      c.globalCompositeOperation = 'multiply'; c.fillStyle = 'rgb(150,190,245)'; c.fillRect(IX, IY, IW, IH);
      c.fillStyle = 'rgba(40,60,110,.55)'; for (let y = IY; y < IY + IH; y += 3.2) c.fillRect(IX, y, IW, 1.2);
      const vg = c.createRadialGradient(IX + IW / 2, IY + IH / 2, IW * .3, IX + IW / 2, IY + IH / 2, IW * .85);
      vg.addColorStop(0, 'rgba(255,255,255,1)'); vg.addColorStop(1, 'rgba(90,110,150,1)'); c.fillStyle = vg; c.fillRect(IX, IY, IW, IH);
    }
    c.restore();
  }
  sprockets(c, 'rgb(255,255,255)');
  // a scratch or two along the base
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = .7; if (rnd() < .3) { const x = rnd() * PITCH; c.beginPath(); c.moveTo(x, 0); c.lineTo(x + rnd() * 3, SH); c.stroke(); }
  // year tab: a paper tab taped over the top edge on each January, the year in grease pencil
  if (captured && !head && i % 12 === 0) {
    const yr = i / 12 + 1;
    c.fillStyle = 'rgb(120,112,98)'; c.fillRect(44, 0, 62, 44);
    c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(38, 30, 74, 12);                // the tape across its foot
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1; c.strokeRect(44.5, .5, 61, 43);
    K.hand(c, String(yr), 75, 7, 26, 'grease', { align: 'center', seed: yr * 3 + 1 });
  }
  tiles.set(i, cv); if (tiles.size > 900) tiles.delete(tiles.keys().next().value);
  return cv;
}
// annotations written on the film (they ride with it): drawn in strip space relative to their frame
let ANN = null;
function greaseBox(c, x, y, w, h, seed) {
  const rnd = K.rng(seed); c.save(); c.strokeStyle = 'rgba(22,16,14,.9)'; c.lineCap = 'round'; c.lineJoin = 'round';
  const pts = [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x + 4, y - 3]];
  for (let pass = 0; pass < 2; pass++) {
    c.lineWidth = 5.5 - pass * 2; c.beginPath();
    pts.forEach(([px, py], k) => { const jx = (rnd() - .5) * 5, jy = (rnd() - .5) * 5; k ? c.lineTo(px + jx, py + jy) : c.moveTo(px + jx, py + jy); });
    c.stroke();
  }
  c.restore();
}
function buildAnnotations() {
  const a1 = K.canvas(900, SH), c1 = a1.getContext('2d');            // LAST LIVE CAPTURE · 10 MAR, centred on NLIVE
  K.hand(c1, 'LAST LIVE CAPTURE · 10 MAR', 450, 229, 17, 'grease', { align: 'center', seed: 21 });
  greaseBox(c1, 450 - 75 + IX - 4, IY - 4, IW + 8, IH + 8, 4);          // the flag round the frame
  const a2 = K.canvas(900, SH), c2 = a2.getContext('2d');            // 212 · TONIGHT beside the clear frame
  greaseBox(c2, 450 - 75 + IX - 5, IY - 5, IW + 10, IH + 10, 9);
  K.hand(c2, '212 · TONIGHT', 450 + 90, 118, 38, 'grease', { seed: 30 });
  return { live: a1, tonight: a2 };
}
function drawStrip(c, p, yoff) {
  const [rx, ry, rw] = R.strip, cx = rw / 2;
  const i0 = Math.floor(p - cx / PITCH) - 1, i1 = Math.ceil(p + cx / PITCH) + 1;
  for (let i = i0; i <= i1; i++) c.drawImage(tile(i), rx + cx - PITCH / 2 + (i - p) * PITCH, ry + yoff);
  // the tape splice between the last live frame and the first generated night
  for (const jn of [NLIVE, NLIVE + NGEN - 1]) {
  const sx = rx + cx + PITCH / 2 + (jn - p) * PITCH;
  if (sx > -80 && sx < rw + 80) {
    c.save(); c.fillStyle = 'rgba(255,250,235,.16)'; c.fillRect(sx - 34, ry + yoff, 68, SH);
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(sx - 34, ry + yoff, 1.5, SH); c.fillRect(sx + 32.5, ry + yoff, 1.5, SH);
    c.strokeStyle = 'rgba(0,0,0,.8)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(sx - 1, ry + yoff); c.lineTo(sx + 1, ry + yoff + SH); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.25)'; for (let k = 0; k < 5; k++) { c.beginPath(); c.arc(sx - 20 + k * 9, ry + yoff + 60 + (k * 37) % 150, 1.5 + (k % 2), 0, 7); c.fill(); }
    c.restore();
  }
  }
  for (const [img, idx] of [[ANN.live, NLIVE], [ANN.tonight, NLIVE + NGEN]]) {
    const x = rx + cx + (idx - p) * PITCH - 450; if (x > -900 && x < rw) c.drawImage(img, x, ry + yoff);
  }
}
const stripBuf = K.canvas(1920, 1080), sb = stripBuf.getContext('2d');
function renderStrip(t) {
  // motion blur over a 180° shutter: average sub-frame positions
  const p1 = posStrip(t), p0 = posStrip(t - F / 2), dpx = Math.abs(p1 - p0) * PITCH;
  const n = Math.max(1, Math.min(40, Math.ceil(dpx / 8)));
  sb.clearRect(0, 0, 1920, 1080);
  // the splice bump: a 2 px jolt as the tape crosses the guide at the window's centre
  for (let k = 0; k < n; k++) {
    const tt = t - F / 2 * (1 - (k + .5) / n), p = posStrip(tt);
    const sd = (NLIVE + .5 - p), bump = Math.abs(sd) < .12 ? 2 * Math.cos(sd / .12 * Math.PI / 2) : 0;
    sb.globalAlpha = 1 / (k + 1); drawStrip(sb, p, -bump);
  }
  sb.globalAlpha = 1;
  const [rx, ry, rw, rh] = R.strip; o.drawImage(stripBuf, rx, ry, rw, rh, rx, ry, rw, rh);
}

// ───── counters ─────
// A drum drawn a little smaller than the kit's so the neighbours only peek at the window's edges.
function drum(c, x, y, w, h, v) {
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); c.fillStyle = '#0b0b0c'; c.fillRect(x, y, w, h);
  const Rr = h * .66, step = Math.PI / 4.4, base = Math.floor(v), m = h * .072;
  for (let d = base - 2; d <= base + 2; d++) {
    const a = (d - v) * step; if (Math.abs(a) > Math.PI / 2) continue;
    c.save(); c.translate(x + w / 2, y + h / 2 + Math.sin(a) * Rr); c.scale(1, Math.cos(a));
    K.capsFill(c, String(((d % 10) + 10) % 10), 0, -3 * m, m, { align: 'center', color: '#ECE8DC', weight: 1.15 }); c.restore();
  }
  const g = c.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, 'rgba(0,0,0,.95)'); g.addColorStop(.26, 'rgba(0,0,0,.25)'); g.addColorStop(.5, 'rgba(255,255,255,.035)');
  g.addColorStop(.74, 'rgba(0,0,0,.25)'); g.addColorStop(1, 'rgba(0,0,0,.95)'); c.fillStyle = g; c.fillRect(x, y, w, h);
  c.restore();
}
function plate(c, x, y, w, h, text, m, seed) {
  c.save(); c.fillStyle = '#2a2f35'; c.beginPath(); c.roundRect(x, y, w, h, 3); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1; c.stroke();
  K.capsEngraved(c, text, x + w / 2, y + (h - 6 * m) / 2, m, { align: 'center', seed, chipRate: .2 });
  for (const sx of [x + 9, x + w - 9]) { c.fillStyle = '#15181b'; c.beginPath(); c.arc(sx, y + h / 2, 3.2, 0, 7); c.fill(); }
  c.restore();
}
let GRIME = null;
function counter(c, reg, digits, n, label, seed, samples) {
  const [x, y, w, h] = reg;
  c.save(); c.fillStyle = '#343b42'; c.fillRect(x, y, w, h);
  c.globalAlpha = .22; c.globalCompositeOperation = 'multiply'; c.drawImage(GRIME, x, y, w, h); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  const dw = 96, gap = 10, ww = digits * dw + (digits - 1) * gap, wx = x + (w - ww) / 2, wy = y + 26, dh = 138;
  // the window's steel frame
  c.fillStyle = '#1b1f23'; c.fillRect(wx - 16, wy - 14, ww + 32, dh + 28);
  c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(wx - 16, wy - 14, ww + 32, 2);
  const buf = K.canvas(ww, dh), bc = buf.getContext('2d');
  for (let s = 0; s < samples.length; s++) {
    const vals = K.drumValues(samples[s], digits), tmp = K.canvas(ww, dh), tc = tmp.getContext('2d');
    vals.forEach((v, k) => drum(tc, k * (dw + gap), 0, dw, dh, v));
    bc.globalAlpha = 1 / (s + 1); bc.drawImage(tmp, 0, 0);
  }
  c.drawImage(buf, wx, wy);
  // the dividers between drums and the glass's cold sheen
  c.fillStyle = '#0d0f11'; for (let k = 1; k < digits; k++) c.fillRect(wx + k * (dw + gap) - gap, wy, gap, dh);
  c.fillStyle = 'rgba(200,230,230,.05)'; c.fillRect(wx, wy + 8, ww, 16);
  plate(c, x + w / 2 - 150, y + h - 52, 300, 40, label, 3.6, seed);
  c.restore();
}
function counterSamples(fn, t) {
  const n1 = fn(t), n0 = fn(t - F / 2), k = Math.max(1, Math.min(10, Math.ceil(Math.abs(n1 - n0) * 1.5)));
  return Array.from({ length: k }, (_, i) => fn(t - F / 2 * (1 - (i + .5) / k)));
}

// ───── the vitals scope ─────
const SC = 520, scopeSrc = K.canvas(SC, SC), ss = scopeSrc.getContext('2d');
let scopeCRT = null;
function scopeContent(t) {
  ss.fillStyle = '#000'; ss.fillRect(0, 0, SC, SC);
  const x0 = 70, x1 = 450, yc = 262, period = 1.25, tau = .5;
  const head = ((t / period) % 1) * (x1 - x0) + x0, sweep = Math.floor(t / period);
  ss.lineCap = 'round'; ss.strokeStyle = K.C.scope; ss.lineWidth = 2.4;
  for (let x = x0; x < x1; x += 3) {
    const behind = head - x, age = (behind >= 0 ? behind : behind + (x1 - x0)) / (x1 - x0) * period;
    const sw = behind >= 0 ? sweep : sweep - 1;
    const y = yc + (K.hash(x * 13 + 1, sw) - .5) * 2, y2 = yc + (K.hash((x + 3) * 13 + 1, sw) - .5) * 2;
    ss.globalAlpha = Math.exp(-age / tau) * .95 + .02; ss.beginPath(); ss.moveTo(x, y); ss.lineTo(x + 3, y2); ss.stroke();
  }
  ss.globalAlpha = 1; ss.fillStyle = '#E6FFF5'; ss.beginPath(); ss.arc(head, yc + (K.hash(Math.round(head) * 13 + 1, sweep) - .5) * 2, 3, 0, 7); ss.fill();
}
function drawScope(c, t) {
  const [x, y, w, h] = R.scope, cx = x + w / 2, cy = y + 240, r = 200;
  // bezel
  c.save(); c.fillStyle = '#23282d'; c.beginPath(); c.arc(cx, cy, r + 34, 0, 7); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.1)'; c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, r + 30, Math.PI, Math.PI * 1.7); c.stroke();
  c.fillStyle = '#0b0d0e'; c.beginPath(); c.arc(cx, cy, r + 6, 0, 7); c.fill();
  for (let k = 0; k < 4; k++) { const a = Math.PI / 4 + k * Math.PI / 2; c.fillStyle = '#121416'; c.beginPath(); c.arc(cx + Math.cos(a) * (r + 20), cy + Math.sin(a) * (r + 20), 5, 0, 7); c.fill(); }
  scopeContent(t);
  const g = scopeCRT.render(scopeSrc, { flicker: .01 * K.noise1(t * 20, 2) });
  c.drawImage(g, 0, 0, SC, SC, cx - SC / 2 * (r / 240), cy - SC / 2 * (r / 240), SC * r / 240, SC * r / 240);
  // the graticule: engraved lines on the filter in front of the glass
  c.beginPath(); c.arc(cx, cy, r, 0, 7); c.clip();
  c.strokeStyle = 'rgba(150,200,185,.13)'; c.lineWidth = 1;
  const d = 36; for (let k = -5; k <= 5; k++) { c.beginPath(); c.moveTo(cx + k * d, cy - r); c.lineTo(cx + k * d, cy + r); c.stroke(); c.beginPath(); c.moveTo(cx - r, cy + k * d); c.lineTo(cx + r, cy + k * d); c.stroke(); }
  c.strokeStyle = 'rgba(150,200,185,.2)';
  for (let k = -25; k <= 25; k++) { c.beginPath(); c.moveTo(cx + k * d / 5, cy - 4); c.lineTo(cx + k * d / 5, cy + 4); c.stroke(); c.beginPath(); c.moveTo(cx - 4, cy + k * d / 5); c.lineTo(cx + 4, cy + k * d / 5); c.stroke(); }
  c.restore();
}

// ───── the tag ─────
let TAG = null;
function buildTag() {
  const [x, y, w, h] = R.tag, cv = K.canvas(1920, 1080), c = cv.getContext('2d');
  c.save(); c.translate(x + w / 2, y + h / 2); c.rotate(-.05); c.translate(-(x + w / 2), -(y + h / 2));
  const tx = x + 60, ty = y + 40, tw = w - 120, th = h - 80;
  c.fillStyle = '#C9B78E'; c.beginPath();                       // a manila tag: clipped corners at the eyelet end
  c.moveTo(tx + 50, ty); c.lineTo(tx + tw, ty); c.lineTo(tx + tw, ty + th); c.lineTo(tx + 50, ty + th); c.lineTo(tx, ty + th - 50); c.lineTo(tx, ty + 50); c.closePath(); c.fill();
  const n = K.noiseCanvas(300, 300, 44, { octaves: [[1, 1], [8, .6], [30, .5]] });
  c.save(); c.clip(); c.globalAlpha = .22; c.globalCompositeOperation = 'multiply'; c.fillStyle = c.createPattern(n, 'repeat'); c.fillRect(tx, ty, tw, th); c.restore();
  c.fillStyle = '#A8966E'; c.beginPath(); c.arc(tx + 42, ty + th / 2, 22, 0, 7); c.fill();          // the eyelet's reinforcement
  c.fillStyle = '#000'; c.beginPath(); c.arc(tx + 42, ty + th / 2, 9, 0, 7); c.fill();
  c.strokeStyle = '#8c7f66'; c.lineWidth = 3; c.beginPath(); c.moveTo(tx + 42, ty + th / 2); c.bezierCurveTo(tx - 20, ty + th / 2 - 30, x - 20, y + 20, x - 60, y - 40); c.stroke();  // the string to the knob
  K.hand(c, '11 MAR · 04:12', tx + 90, ty + th / 2 - 30, 52, 'ink', { seed: 3 });
  { // the pen's dot between date and time (a single stab, which the joined hand skips)
    const Lh = K.capsLayout('11 MAR · 04:12', 4, .55), g = Lh.glyphs.find(q => q.ch === '·'), m = 52 / 6;
    c.fillStyle = 'rgba(26,30,52,.9)'; c.beginPath(); c.ellipse(tx + 90 + (g.x + .5) * m + 3 * m * .42, ty + th / 2 - 30 + 3 * m, 3.4, 2.6, -.5, 0, 7); c.fill();
  }
  c.restore(); return cv;
}

window.ready = (async () => {
  SRC.father = await K.asset('father'); SRC.k02 = await K.asset('k02'); SRC.k01 = await K.asset('k01');
  VAR = buildVariants(); ANN = buildAnnotations(); TAG = buildTag();
  GRIME = K.noiseCanvas(350, 125, 71, { octaves: [[2, 1], [12, .7], [45, .6]] });
  scopeCRT = new K.CRT({ W: SC, H: SC, rect: [20, 20, 480, 480], k1: .06, corner: .5, vig: .3, bloom: 1.1, halo: .15,
    exposure: 1.3, glass: [.018, .03, .027], glare: .03, dustAmt: .6, dustSeed: 23 });
})();
window.renderFrame = async t => {
  await window.ready;
  o.fillStyle = '#000'; o.fillRect(0, 0, 1920, 1080);
  renderStrip(t);
  counter(o, R.captured, 5, 0, 'CAPTURED', 5, counterSamples(capturedCount, t));
  counter(o, R.generated, 3, 0, 'GENERATED', 6, counterSamples(generatedCount, t));
  drawScope(o, t);
  plate(o, ...R.vitalsPlate, 'VITALS · SUBJECT F', 3.8, 8);
  const lv = t < 4.9 ? 0 : t < 4.9 + 2 * F ? .12 : 1;
  const [lx, ly, lw, lh] = R.noSignal; K.legendLamp(o, lx + 10, ly + 10, lw - 20, lh - 20, 'NO SIGNAL', { color: 'red', level: lv });
  // the tag, lit only by the scope's green-cyan spill: 5 % → 25 % once the lamp is on
  const b = .05 + .2 * K.ease.outCubic(K.clamp((t - 4.9) / .6));
  const [tx, ty, tw, th] = R.tag; o.save(); o.beginPath(); o.rect(tx, ty, tw, th); o.clip();
  o.drawImage(TAG, 0, 0); o.globalCompositeOperation = 'multiply';
  o.fillStyle = `rgb(${Math.round(255 * b * .78)},${Math.round(255 * b)},${Math.round(255 * b * .92)})`; o.fillRect(tx, ty, tw, th); o.restore();
};
